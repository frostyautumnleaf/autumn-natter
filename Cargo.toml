[package]
name = "autumn-natter"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Chat client for local LLMs. It uses llama.cpp as the inference backend."
license = "MIT"
readme = "README.md"
repository = "https://github.com/frostyautumnleaf/autumn-natter"
build = "build.rs"

[dependencies]
# Iced is the front-end UI framework. It draws with a GPU or with the software
# fallback, and works on Wayland, X11 and Windows.
iced = { version = "0.14", features = ["svg", "tokio"] }
# The shell of Iced. It is used to run a program that draws more than one
# window, which the plain builder of the iced crate cannot do.
iced_winit = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
getrandom = "0.3"
# HTTP client for the OpenAI compatible API of llama-server. Rustls avoids
# OpenSSL on both Linux and Windows.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
# Small blocking HTTP server for the remote (browser) mode.
tiny_http = "0.12"
urlencoding = "2"
pulldown-cmark = "0.13"

[dev-dependencies]
# The software renderer of Iced. The pictures of the window use it, because this
# machine has no display server.
iced_tiny_skia = "0.14"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"
