[package]
name = "autumn-natter"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Chat client for local LLMs. It uses llama.cpp as the inference backend."
license = "MIT"
readme = "README.md"
repository = "https://github.com/frostyautumnleaf/autumn-natter"
build = "build.rs"

[dependencies]
# Slint is the front-end UI framework. The software renderer keeps the binary
# small and works on Wayland and X11 without an OpenGL stack.
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit-wayland",
    "backend-winit-x11",
    "renderer-software",
    "accessibility",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
getrandom = "0.3"
# HTTP client for the OpenAI compatible API of llama-server. Rustls avoids
# OpenSSL on both Linux and Windows.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
# Small blocking HTTP server for the remote (browser) mode.
tiny_http = "0.12"
urlencoding = "2"
pulldown-cmark = "0.13"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
slint-build = "1.18"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"
