# Autumn Natter is a workspace of two crates.
#
#   .            the core: engine, settings, store, llama.cpp, the tool, the
#                device list, UPnP, the remote page. No window, no web view.
#   src-tauri    the desktop window. Rust on the back, and an HTML page shown
#                by the web view of the system. The window is the program the
#                user runs, so it is the default member.
#
# The core has no window code, so `cargo test -p autumn-natter-core` runs the
# rules of the chats here, with no display and no web view needed.
[workspace]
resolver = "2"
members = ["src-tauri"]
default-members = ["src-tauri"]

[package]
name = "autumn-natter-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Chat client for local LLMs. It uses llama.cpp as the inference backend."
license = "MIT"
readme = "README.md"
repository = "https://github.com/frostyautumnleaf/autumn-natter"

[lib]
name = "autumn_natter_core"
path = "src/lib.rs"

# A live run of the engine against a real model, for the handoff summary. Not part of the
# program: it is started manually with `cargo run --bin`.
[[bin]]
name = "an-summary-run"
path = "src/bin/an-summary-run.rs"
required-features = ["live-driver"]

[features]
# The live run of the engine against a real model. It reaches the state of the engine to switch
# the devices of the computer off, which no call of the program does. The program is built
# without it.
live-driver = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
getrandom = "0.3"
# HTTP client for the OpenAI compatible API of llama-server. Rustls avoids OpenSSL on both Linux
# and Windows.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
# Small blocking HTTP server for the remote (browser) mode.
tiny_http = "0.12"
urlencoding = "2"
pulldown-cmark = "0.13"
# The contexts the model processed are compressed before they are written to disk. Deflate at
# level 1 gives the best compression of the fast options here; the Rust back end keeps the build
# free of C, as the rest of the program is. See `src/contexts.rs`.
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
# The text of the program is in SQLite files, not in a directory of JSON files. `bundled`
# carries the C of SQLite with it, so the program needs nothing of the computer and works the
# same on Ubuntu, Arch and Windows. Only the parts the program uses are switched on, so the
# binary stays as light as the rest of it. See `src/db.rs`.
rusqlite = { version = "0.37", default-features = false, features = ["bundled"] }
# The infographic suite: a frame is a document of SVG, and these turn the text into an image, an
# image into bytes, and bytes into a film. resvg is pure Rust, so no C library is added to the
# build.
resvg = "0.48"
# The two readers of the letters: `fontdb` finds the fonts of the computer, `ttf-parser`
# measures them. The layout must know how wide a word is before it is drawn, and the answer must
# be the width the image will show.
fontdb = "0.24"
ttf-parser = "0.25"
# The moving image, when the computer has no `ffmpeg`.
gif = "0.14"
# The images a block may carry, extracted from the text of a script.
base64 = "0.22"
# The WebP of the `view_images` tool, decoded here and sent to the model as a PNG. The projector
# of llama.cpp reads a WebP only through ffmpeg, which is on some machines and not on others.
# Both of these are already in the tree through resvg, so neither adds anything to the binary.
image-webp = "0.2"
# Resize desktop captures before sending them to a vision model.
image = { version = "0.25", default-features = false, features = ["png"] }
png = "0.18"
# X11 handles Linux desktop capture directly; Wayland uses the desktop portals, without requiring
# PipeWire development headers at build time.
enigo = "0.6.1"
url = "2.5"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["randr", "render", "xinput", "xtest"] }
ashpd = { version = "0.12.3", default-features = false, features = ["async-std"] }
futures = { version = "0.3", default-features = false, features = ["executor"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
xcap = "0.9.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The program must stay light. The release profile optimises for size.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"

# The live checks that are in tests/ speak to a server of their own over HTTP, so they want the
# same client the program speaks with. It is already in the list above; naming it here as well
# costs nothing and no new package is read.
[dev-dependencies]
ureq = { version = "2", default-features = false, features = ["json"] }
serde_json = { version = "1", features = ["preserve_order"] }
