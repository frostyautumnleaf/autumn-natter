# Autumn Natter is a workspace of two crates.
#
#   .            the core: engine, settings, store, llama.cpp, the tool, the
#                device list, UPnP, the remote page. No window, no web view.
#   src-tauri    the desktop window. Rust on the back, and an HTML page shown
#                by the web view of the system. The window is the program the
#                user runs, so it is the default member.
#
# The core has no window code, so `cargo test -p autumn-natter-core` runs the
# rules of the chats here, with no display and no web view needed.
[workspace]
resolver = "2"
members = ["src-tauri"]
default-members = ["src-tauri"]

[package]
name = "autumn-natter-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Chat client for local LLMs. It uses llama.cpp as the inference backend."
license = "MIT"
readme = "README.md"
repository = "https://github.com/frostyautumnleaf/autumn-natter"

[lib]
name = "autumn_natter_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
getrandom = "0.3"
# HTTP client for the OpenAI compatible API of llama-server. Rustls avoids
# OpenSSL on both Linux and Windows.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
# Small blocking HTTP server for the remote (browser) mode.
tiny_http = "0.12"
urlencoding = "2"
pulldown-cmark = "0.13"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The program must stay light. The release profile optimises for size.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"
