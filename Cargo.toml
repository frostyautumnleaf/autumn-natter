# Autumn Natter is a workspace of two crates.
#
#   .            the core: engine, settings, store, llama.cpp, the tool, the
#                device list, UPnP, the remote page. No window, no web view.
#   src-tauri    the desktop window. Rust on the back, and an HTML page shown
#                by the web view of the system. The window is the program the
#                user runs, so it is the default member.
#
# The core has no window code, so `cargo test -p autumn-natter-core` runs the
# rules of the chats here, with no display and no web view needed.
[workspace]
resolver = "2"
members = ["src-tauri"]
default-members = ["src-tauri"]

[package]
name = "autumn-natter-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Chat client for local LLMs. It uses llama.cpp as the inference backend."
license = "MIT"
readme = "README.md"
repository = "https://github.com/frostyautumnleaf/autumn-natter"

[lib]
name = "autumn_natter_core"
path = "src/lib.rs"

# A live run of the engine against a real model, for the handoff summary. Not
# part of the program: it is started by hand with `cargo run --bin`.
[[bin]]
name = "an-summary-run"
path = "src/bin/an-summary-run.rs"
required-features = ["live-driver"]

[features]
# The live run of the engine against a real model. It reaches the state of the
# engine to switch the devices of the machine off, which no call of the program
# does. The program is built without it.
live-driver = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
getrandom = "0.3"
# HTTP client for the OpenAI compatible API of llama-server. Rustls avoids
# OpenSSL on both Linux and Windows.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
# Small blocking HTTP server for the remote (browser) mode.
tiny_http = "0.12"
urlencoding = "2"
pulldown-cmark = "0.13"
# The talks the model worked through are shortened before they stand on the
# disk. Deflate at level 1 is the fastest thing here that gives anything away on
# those bytes; the Rust back end keeps the build free of C, as the rest of the
# program is. See `src/contexts.rs`.
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
# The infographic suite: a frame is a document of SVG, and these turn the words
# into a picture, a picture into bytes, and bytes into a film. resvg is pure
# Rust, so no C library is added to the build.
resvg = "0.48"
# The two readers of the letters: `fontdb` finds the fonts of the machine,
# `ttf-parser` measures them. The layout must know how wide a word is before it
# is drawn, and the answer must be the width the picture will show.
fontdb = "0.24"
ttf-parser = "0.25"
# The moving picture, when the machine has no `ffmpeg`.
gif = "0.14"
# The pictures a block may carry, read out of the words of a script.
base64 = "0.22"
# The WebP of the `view_images` tool, decoded here and sent to the model as a PNG.
# The projector of llama.cpp reads a WebP only through ffmpeg, which stands on some
# machines and not on others. Both of these are already in the tree through resvg,
# so neither adds anything to the binary.
image-webp = "0.2"
png = "0.18"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The program must stay light. The release profile optimises for size.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"

# The live checks that stand in tests/ speak to a server of their own over HTTP,
# so they want the same client the program speaks with. It is already in the list
# above; naming it here as well costs nothing and no new package is read.
[dev-dependencies]
ureq = { version = "2", default-features = false, features = ["json"] }
serde_json = { version = "1", features = ["preserve_order"] }
