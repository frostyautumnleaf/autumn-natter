<!doctype html>
<!--
  Autumn Natter. The window of the program.

  The page is drawn here and shown by the web view of the system. It talks to
  the engine through Tauri, and never over the network. The look follows the
  rules of the program: five accents, a pale skin and a warm dark skin, no
  colour of the theme of the browser showing through.

  The parts of the window, from the top down:

    bar      the model, the repository, the name of the chat, the context
             meter, and the marks for the two windows of settings
    stage    the chat in use, and the row of small previews over it
    dock     the chat box with its badges, and the line of state
    sheet    the settings, in two tabs, over the window

  With no chat open the mark, the line for this hour and the chat box stand
  together in the middle of the window.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autumn Natter</title>
<style>
/* ---------------------------------------------------------------- tokens */
/* Five accents, one pale skin, one warm dark skin. Every other colour is a
   neutral, or a mix of one of the five with a neutral. Nothing here comes from
   a theme, so no blue can show through in either skin. */
:root {
  --accent: #ED7401; --warm: #DF6101; --strong: #C53C01; --leaf: #AC4422; --deep: #AF2600;
  --accent-soft: rgba(237, 116, 1, .12);
  --accent-line: rgba(237, 116, 1, .42);

  --bg: #faf2e6; --surface: #fffdf8; --surface-2: #f4e9d8; --surface-3: #efe1cc;
  --line: #e7d8c3; --line-soft: #efe2d1; --line-strong: #d8c2a4;
  --text: #241b12; --text-2: #4b3e30; --dim: #7c6b58; --faint: #a2917c;
  --hover: #f7ebd9; --tint: #fbe6d1; --on-accent: #fffaf2;

  --bubble: #fbe6d1; --bubble-line: #f0d2b0;
  --code-bg: #f6ecdc; --code-line: #e8d7bf;
  --think-bg: #f8eedf; --tool-bg: #f7eee0;
  --scrim: rgba(38, 26, 15, .46);
  --shadow-1: 0 1px 2px rgba(70, 40, 12, .07);
  --shadow-2: 0 2px 6px rgba(70, 40, 12, .08), 0 14px 34px rgba(70, 40, 12, .10);
  --ring: 0 0 0 3px rgba(237, 116, 1, .12);

  --bar-h: 54px;
  --col: 780px;
  --r-s: 8px; --r-m: 12px; --r-l: 16px;
}
body.dark {
  --accent-soft: rgba(237, 116, 1, .17);
  --accent-line: rgba(237, 116, 1, .5);

  --bg: #141414; --surface: #1b1b1b; --surface-2: #232323; --surface-3: #2b2b2b;
  --line: #342f2a; --line-soft: #2b2723; --line-strong: #473f36;
  --text: #f2ebe2; --text-2: #d9cfc3; --dim: #a4998c; --faint: #857c71;
  --hover: #262422; --tint: #2c1d10; --on-accent: #fff8ef;

  --bubble: #2b1c10; --bubble-line: #4a3626;
  --code-bg: #201d1a; --code-line: #37312a;
  --think-bg: #221e1a; --tool-bg: #211e1b;
  --scrim: rgba(8, 7, 6, .6);
  --ring: 0 0 0 3px rgba(237, 116, 1, .16);
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow-2: 0 2px 6px rgba(0, 0, 0, .45), 0 16px 38px rgba(0, 0, 0, .5);
}
/* A word in an accent colour needs the bright end of the accent in the dark
   skin, where #C53C01 cannot be read on #141414. The mix is of an allowed
   accent with a neutral, so no new colour is added. A plain value stands
   under it for a web view without color-mix. */
:root { --ink: var(--strong); --ink-leaf: var(--leaf); --ink-fail: var(--deep); }
body.dark { --ink: #f08a2a; --ink-leaf: #d9713f; --ink-fail: #e0603a; }
@supports (color: color-mix(in oklab, red, blue)) {
  body.dark {
    --ink: color-mix(in oklab, var(--accent) 74%, #fff6ec);
    --ink-leaf: color-mix(in oklab, var(--leaf) 72%, #fff6ec);
    --ink-fail: color-mix(in oklab, var(--deep) 62%, #fff2e8);
  }
}

/* The web view is told which skin is in use, so the parts it draws itself, the
   list of a choice, the box of a switch and the bar of a slider, follow the
   skin instead of the usual pale grey. */
:root { color-scheme: light; }
body.dark { color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 system-ui, "Segoe UI", "Noto Sans", sans-serif;
  display: flex; flex-direction: column;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
select {
  font: inherit; color: inherit; background: none; border: 0; cursor: pointer;
  appearance: none; -webkit-appearance: none; text-align: left;
}
textarea, input { font: inherit; color: inherit; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
/* The chat box says it holds the keys with its own edge, so the field inside it
   does not draw a ring of its own. */
#draft:focus, #draft:focus-visible { outline: none; }
.grow { flex: 1 1 auto; min-width: 0; }
.hidden { display: none !important; }
.mono { font-family: ui-monospace, "Cascadia Mono", "DejaVu Sans Mono", Menlo, Consolas, monospace; }
.svg { width: 16px; height: 16px; flex: 0 0 auto; fill: none; stroke: currentColor;
  stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* ------------------------------------------------------------------ bar */
/* One bar, three groups. The left group holds the program and what it runs on,
   the middle holds the chat in use, the right holds the meter and the marks
   for the settings. Groups are kept apart by a hairline, not by a box. */
.bar {
  flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
  height: var(--bar-h); padding: 0 12px;
  background: var(--surface); border-bottom: 1px solid var(--line);
  position: relative; z-index: 20;
}
.brand { display: flex; align-items: center; gap: 9px; flex: 0 0 auto; padding-right: 2px; }
.brand .mark { width: 21px; height: 21px; display: block; }
.brand .word { font-size: 14.5px; font-weight: 650; letter-spacing: .01em; white-space: nowrap; }
.rule { width: 1px; height: 24px; background: var(--line); flex: 0 0 auto; }

/* A field is a control with a hairline and a mark. It is not a native select,
   so the arrow and the padding are the same in every web view. */
.field {
  display: inline-flex; align-items: center; gap: 7px;
  height: 32px; padding: 0 8px 0 9px; border-radius: var(--r-s);
  border: 1px solid var(--line); background: var(--surface-2);
  color: var(--text-2); font-size: 13px; max-width: 264px; min-width: 0;
  transition: border-color 140ms, background 140ms;
}
.field:hover { border-color: var(--line-strong); background: var(--surface-3); }
.field .svg { width: 14px; height: 14px; stroke: var(--dim); }
.field select {
  display: block; max-width: 190px; min-width: 0; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; font-size: 13px;
  text-align: left; cursor: pointer;
}
.tag {
  flex: 0 0 auto; font-size: 10.5px; font-weight: 650; letter-spacing: .06em;
  text-transform: uppercase; color: var(--ink);
}
.field .arrow { width: 12px; height: 12px; stroke: var(--faint); }
.field:focus-within { border-color: var(--accent); box-shadow: var(--ring); }

/* A mark button is a square of 30 with a picture in it and nothing else. */
.mark-btn {
  flex: 0 0 auto; width: 30px; height: 30px; border-radius: var(--r-s);
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--dim); border: 1px solid transparent;
  transition: background 140ms, color 140ms, border-color 140ms;
}
.mark-btn:hover { background: var(--hover); color: var(--text); border-color: var(--line); }
.mark-btn:hover .svg { stroke: var(--ink); }
.mark-btn .svg { width: 16px; height: 16px; }
.mark-btn.on { color: var(--ink); background: var(--accent-soft); border-color: var(--accent-line); }

/* The middle of the bar: the name of the chat, and the turn of the carousel. */
.spot { display: flex; align-items: center; gap: 10px; flex: 1 1 auto; min-width: 0;
  justify-content: center; }
.spot .title {
  font-size: 13.5px; font-weight: 600; color: var(--text);
  max-width: 42ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.spot .title.none { color: var(--faint); font-weight: 500; }
.pager { display: inline-flex; align-items: center; gap: 1px; flex: 0 0 auto;
  border: 1px solid var(--line); border-radius: 999px; background: var(--surface-2); height: 26px; }
.pager button { width: 24px; height: 24px; border-radius: 999px; display: inline-flex;
  align-items: center; justify-content: center; color: var(--dim); }
.pager button:hover:not([disabled]) { background: var(--accent-soft); color: var(--ink); }
.pager button[disabled] { opacity: .35; cursor: default; }
.pager .svg { width: 13px; height: 13px; }
.pager .count { font-size: 11.5px; color: var(--dim); padding: 0 4px; white-space: nowrap;
  font-variant-numeric: tabular-nums; }

/* The right of the bar: the meter of the context, then the settings. */
.meter-box { flex: 0 0 auto; width: 122px; display: flex; flex-direction: column; gap: 5px;
  padding: 0 6px; }
.meter-box .row1 { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
.meter-box .num { font-size: 11px; color: var(--dim); white-space: nowrap;
  font-variant-numeric: tabular-nums; }
.meter-box .pct { font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
.meter { display: block; height: 4px; border-radius: 999px; background: var(--surface-3);
  overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 999px; background: var(--accent);
  transition: width 300ms ease, background 200ms; }
.meter-box.near .num { color: var(--ink-fail); font-weight: 600; }
.meter-box.near .meter i { background: var(--ink-fail); }

/* ----------------------------------------------------------------- area */
.area { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; min-width: 0; }

/* The first screen: the mark, the line for this hour, and the chat box, as one
   group in the middle of the room below the bar. */
.hello { flex: 0 0 auto; display: none; flex-direction: column; align-items: center;
  gap: 14px; padding: 20px 20px 26px; text-align: center; }
body.home .area { justify-content: center; }
body.home .hello { display: flex; }
body.home .stage { display: none; }
.hello .mark { width: 62px; height: 62px; }
.hello .greet { font-size: 17px; color: var(--text-2); max-width: 34ch; line-height: 1.4; }
.hello .where { font-size: 12.5px; color: var(--faint); max-width: 60ch; }
.hello .where b { color: var(--dim); font-weight: 600; }

/* The stage: the chat in use, and the row of previews over it. */
.stage { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; }

/* ------------------------------------------------------------ the thread */
.thread {
  position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain;
  padding: 22px 0 26px; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent;
}
.thread::-webkit-scrollbar { width: 8px; }
.thread::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 999px;
  border: 2px solid transparent; background-clip: padding-box; }
.thread::-webkit-scrollbar-thumb:hover { background: var(--dim); background-clip: padding-box; }
.thread::-webkit-scrollbar-track { background: transparent; }
.col { max-width: var(--col); margin: 0 auto; padding: 0 26px; }
.empty { color: var(--faint); font-size: 13.5px; padding: 26px 4px; text-align: center; }
.empty b { display: block; color: var(--dim); font-weight: 600; margin-bottom: 4px; }

/* One turn of the talk. The words of the user stand in a bubble on the right,
   with the near corner cut. The words of the model stand on the page with no
   bubble, because the bubble of the user is the mark of the user. A hairline
   keeps the turns apart, so a long talk can be read in pieces. */
.turn { position: relative; }
.turn + .turn { border-top: 1px solid var(--line-soft); margin-top: 20px; padding-top: 20px; }
.turn.t-you { display: flex; flex-direction: column; align-items: flex-end; }
/* A note carries two hairlines of its own, so the rule between turns is left
   out and the note gets more room instead. */
.turn.t-note { border-top: 0; margin-top: 26px; padding-top: 6px; }
.turn.in { animation: rise 240ms ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
/* The next chat of the carousel is slid in from the side it came from. */
@keyframes slide { from { opacity: 0; transform: translateX(var(--from, 0)); }
  to { opacity: 1; transform: none; } }

.bubble {
  max-width: 82%; padding: 11px 14px; background: var(--bubble);
  border: 1px solid var(--bubble-line); border-radius: var(--r-l) var(--r-l) 4px var(--r-l);
  white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.5;
}
.plain { min-width: 0; }
.stamp { font-size: 11px; color: var(--faint); margin-top: 5px; opacity: 0;
  transition: opacity 160ms; font-variant-numeric: tabular-nums; }
.turn:hover .stamp { opacity: 1; }
.turn.t-you .stamp { padding-right: 2px; }

/* Words of one kind, as the window sets them. */
.body { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0 0 9px; }
.body:last-child { margin-bottom: 0; }
.h { font-weight: 650; color: var(--ink); margin: 16px 0 7px; line-height: 1.35;
  display: flex; align-items: baseline; gap: 9px; }
.h::before { content: ""; flex: 0 0 3px; width: 3px; height: 14px; border-radius: 2px;
  background: var(--accent); }
.turn.t-you .h { color: var(--ink); }
.h.l1 { font-size: 17px; } .h.l1::before { height: 16px; }
.h.l2 { font-size: 15.5px; }
.h.l3, .h.l4, .h.l5, .h.l6 { font-size: 14px; color: var(--ink-leaf); }
.h:first-child { margin-top: 2px; }
/* The mark of an item stands outside its box, in the room the list leaves for
   it. The room must be wider than the widest number, or the number stands over
   the rule. Two digits and a gap are kept for it, and the words of the item
   start after a gap of their own. */
ul.marks, ol.marks { margin: 4px 0 10px; padding: 1px 0 1px 40px;
  border-left: 2px solid var(--line-strong); }
ul.marks li, ol.marks li { margin: 4px 0; padding-left: 6px; }
ul.marks li::marker { color: var(--dim); }
ol.marks li::marker { color: var(--ink-leaf); font-weight: 600; }
pre.code {
  margin: 4px 0 11px; padding: 11px 13px; background: var(--code-bg);
  border: 1px solid var(--code-line); border-radius: 10px;
  font-family: ui-monospace, "Cascadia Mono", "DejaVu Sans Mono", Menlo, Consolas, monospace;
  font-size: 12.5px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere;
  max-height: 420px; overflow-y: auto; scrollbar-width: thin;
  scrollbar-color: var(--line-strong) transparent; color: var(--text-2);
}

/* The thinking of the model: a look inside the answer, so it is kept small and
   behind a rule of colour. The words are cut off at a height, and the reader
   can scroll inside the panel. */
.think { position: relative; margin: 0 0 11px; padding: 9px 13px 10px 19px;
  background: var(--think-bg); border: 1px solid var(--line-soft); border-radius: 10px; }
.think::before { content: ""; position: absolute; left: 9px; top: 8px; bottom: 8px; width: 2px;
  border-radius: 2px; background: var(--accent); }
.think .cap { display: flex; align-items: center; gap: 7px; font-size: 10.5px; font-weight: 650;
  letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin-bottom: 5px; }
.think .cap .svg { width: 12px; height: 12px; stroke: var(--ink); }
.think .words { font-size: 13px; line-height: 1.5; color: var(--dim); white-space: pre-wrap;
  overflow-wrap: anywhere; max-height: 190px; overflow-y: auto; scrollbar-width: thin; }

/* The mark of an answer that is still coming. */
.caret { display: inline-block; width: 7px; height: 15px; margin-top: 2px; border-radius: 1px;
  background: var(--accent); animation: beat 1.1s ease-in-out infinite; vertical-align: text-bottom; }

/* The words of an answer that are new. They go on the page a few at a time, so
   a new run fades in instead of popping in. */
@keyframes ink { from { opacity: 0; } to { opacity: 1; } }
.ink { animation: ink 420ms ease-out; }

/* A note from the program stands in the middle, between two hairlines, with no
   bubble around it. */
.note { display: flex; align-items: center; gap: 12px; color: var(--dim); font-size: 12px;
  text-align: center; white-space: pre-wrap; overflow-wrap: anywhere; }
.note::before, .note::after { content: ""; flex: 1 1 auto; height: 1px; background: var(--line); }
.turn.bad .note { color: var(--ink-fail); }
.turn.bad .body, .turn.bad .bubble, .turn.bad .plain { color: var(--ink-fail); }

/* One run of the terminal tool. The head says which command runs, or has run,
   and gives the state of the run. The body keeps the command and the output
   under their own small labels, each cut off at a height. */
.tool { margin: 2px 0 11px; background: var(--tool-bg); border: 1px solid var(--line);
  border-radius: 10px; overflow: hidden; }
.tool.bad { border-color: var(--deep); }
.thead { display: flex; align-items: center; gap: 9px; width: 100%; min-height: 34px;
  padding: 0 11px 0 12px; text-align: left; }
.thead:hover { background: var(--hover); }
.thead .svg { width: 14px; height: 14px; stroke: var(--dim); }
.thead .cmd { flex: 1 1 auto; min-width: 0; font-size: 12.5px; font-weight: 600;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace; }
.tool.bad .cmd { color: var(--ink-fail); }
.state { flex: 0 0 auto; font-size: 10.5px; font-weight: 650; letter-spacing: .06em;
  text-transform: uppercase; color: var(--dim); padding: 2px 7px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); }
.state.run { color: var(--ink); border-color: var(--accent-line); background: var(--accent-soft);
  animation: beat 1.4s ease-in-out infinite; }
.state.fail { color: var(--ink-fail); border-color: var(--ink-fail); }
.thead .fold { margin-left: 4px; transition: transform 180ms; stroke: var(--faint); }
.tool.closed .fold { transform: rotate(-90deg); }
.tbody { display: flex; gap: 12px; padding: 2px 12px 12px 13px; }
.tool.closed .tbody { display: none; }
.tbody .rail { flex: 0 0 2px; align-self: stretch; border-radius: 2px; background: var(--line-strong); }
.tspace { flex: 1 1 auto; min-width: 0; }
.lab { font-size: 10.5px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase;
  color: var(--faint); margin: 6px 0 3px; }
.cmd-text, .out {
  font-family: ui-monospace, "Cascadia Mono", "DejaVu Sans Mono", Menlo, Consolas, monospace;
  font-size: 12px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0;
  max-height: 260px; overflow-y: auto; scrollbar-width: thin;
  scrollbar-color: var(--line-strong) transparent; color: var(--text-2);
}
.out.live { color: var(--dim); }
.tool.bad .out { color: var(--ink-fail); }

/* ------------------------------------------------- the row of previews */
/* Alt turns the chats of this place into a row of small previews. The row is a
   second look at the same carousel: the middle preview is the chat in use, a
   click opens it, and Escape or Alt puts the row away. */
.veil { position: absolute; inset: 0; z-index: 8; display: none; }
.veil.on { display: block; }
.veil::before { content: ""; position: absolute; inset: 0; background: var(--bg); opacity: 1; }
.row-head, .row-foot { position: absolute; left: 50%; transform: translateX(-50%); z-index: 9;
  display: none; text-align: center; color: var(--dim); font-size: 12px; width: min(640px, 88%); }
.veil.on ~ .row-head, .veil.on ~ .row-foot { display: block; }
.row-head { top: 18px; }
.row-foot { bottom: 16px; font-size: 11.5px; color: var(--faint); }
.row-head b { color: var(--text-2); font-weight: 650; }
.row-head .at { color: var(--dim); font-weight: 400; }
.row-foot kbd { font: inherit; font-size: 11px; color: var(--dim); background: var(--surface-2);
  border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; margin: 0 1px; }
.previews { position: absolute; left: 0; right: 0; top: 50%; z-index: 9; }
.prev { position: absolute; top: 0; left: 0; display: block; width: 190px; height: 224px;
  border-radius: var(--r-m); border: 1px solid var(--line); background: var(--surface);
  overflow: hidden; cursor: pointer; box-shadow: var(--shadow-1); text-align: left;
  color: var(--text); padding: 0; }
.prev.mid { border: 2px solid var(--accent); box-shadow: var(--shadow-2); }
.prev:hover { border-color: var(--accent-line); }
.prev .pt { font-size: 13px; font-weight: 650; margin: 13px 13px 0; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
.prev .pp { font-size: 12px; line-height: 1.45; color: var(--dim); margin: 8px 13px 0;
  max-height: 88px; overflow: hidden;
  display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; }
.prev .pw { position: absolute; left: 13px; right: 13px; bottom: 11px; font-size: 11px;
  color: var(--faint); display: flex; justify-content: space-between; gap: 8px; }
.prev .pw .rn { color: var(--ink-leaf); overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; }

/* The arrows that turn the carousel. They stand at the edge of the stage and
   only when a chat sits that way. */
/* While the row of previews stands in front, the chat and its arrows are put
   away, so no word of the chat shows behind a preview. */
body.rowon .thread, body.rowon .turn-btn { visibility: hidden; }
.turn-btn { position: absolute; top: 50%; margin-top: -17px; width: 34px; height: 34px;
  border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
  color: var(--dim); z-index: 6; display: inline-flex; align-items: center; justify-content: center;
  box-shadow: var(--shadow-1); transition: color 140ms, border-color 140ms, background 140ms; }
.turn-btn:hover { color: var(--ink); border-color: var(--accent-line); background: var(--tint); }
.turn-btn .svg { width: 16px; height: 16px; }
.turn-btn.l { left: 12px; } .turn-btn.r { right: 12px; }

/* ------------------------------------------------------------------ dock */
/* The chat box, and the line of state under it. The box holds its badges in a
   row of their own, so no part of the box is left empty. */
.dock { flex: 0 0 auto; padding: 0 14px 12px; }
body.home .dock { width: min(760px, 100%); margin: 0 auto; padding: 0 20px; }
.box {
  border: 1px solid var(--line); border-radius: var(--r-l); background: var(--surface);
  box-shadow: var(--shadow-1); transition: border-color 160ms, box-shadow 160ms;
}
.box.focus { border-color: var(--line-strong); box-shadow: var(--shadow-1), var(--ring); }
#draft {
  display: block; width: 100%; min-height: 26px; max-height: 40vh; padding: 13px 15px 4px;
  background: none; border: 0; resize: none; font-size: 15px; line-height: 1.5;
  overflow-y: auto; scrollbar-width: thin;
}
#draft::placeholder { color: var(--faint); }
.dock-row { display: flex; align-items: center; gap: 8px; padding: 6px 8px 8px 10px; }
.badges { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
.badge {
  display: inline-flex; align-items: center; gap: 6px; height: 27px; padding: 0 10px;
  border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2);
  color: var(--dim); font-size: 12px; white-space: nowrap;
  transition: color 140ms, background 140ms, border-color 140ms;
}
.badge .svg { width: 13px; height: 13px; }
.badge:hover { color: var(--text-2); border-color: var(--line-strong); background: var(--surface-3); }
.badge.on { color: var(--ink); background: var(--accent-soft); border-color: var(--accent-line); }
.badge.on .svg { stroke: var(--ink); }
.badge.off { color: var(--ink-fail); border-color: var(--ink-fail); }
.badge[disabled] { opacity: .5; cursor: default; }
.badge.static { cursor: default; }
.keys { font-size: 11.5px; color: var(--faint); white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; }
.keys kbd { font: inherit; font-size: 11px; color: var(--dim); background: var(--surface-2);
  border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; margin: 0 1px; }
.send {
  flex: 0 0 auto; width: 34px; height: 34px; border-radius: 999px; background: var(--accent);
  color: var(--on-accent); display: inline-flex; align-items: center; justify-content: center;
  opacity: .38; transition: opacity 160ms, background 160ms, transform 120ms;
}
.send .svg { width: 17px; height: 17px; stroke-width: 2; }
.send .mark-stop { display: none; }
.send.live { opacity: 1; }
.send.live:hover { background: var(--warm); }
.send.live:active { transform: scale(.94); }
.send.stop { opacity: 1; background: var(--strong); }
.send.stop:hover { background: var(--deep); }
.send.stop .mark-send { display: none; }
.send.stop .mark-stop { display: inline; }

/* The line of state under the box. */
.state-line { display: flex; align-items: center; gap: 9px; padding: 9px 4px 0; }
.pulse { width: 7px; height: 7px; border-radius: 999px; background: var(--faint); flex: 0 0 auto;
  opacity: .55; }
.pulse.busy { background: var(--accent); opacity: 1; animation: beat 1.1s ease-in-out infinite; }
.pulse.busy.stop { background: var(--strong); }
@keyframes beat { 50% { opacity: .32; } }
.status { font-size: 12px; color: var(--dim); overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; }
.status.hot { color: var(--ink); font-weight: 600; }
.quiet {
  display: inline-flex; align-items: center; gap: 6px; height: 27px; padding: 0 11px;
  border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
  color: var(--text-2); font-size: 12px; white-space: nowrap;
  transition: color 140ms, border-color 140ms, background 140ms;
}
.quiet:hover { color: var(--ink); border-color: var(--accent-line); background: var(--tint); }
.quiet .svg { width: 13px; height: 13px; stroke: var(--ink); }

/* --------------------------------------------------- size and movement */
@media (max-width: 1000px) {
  .brand .word { display: none; }
  .spot .title { max-width: 26ch; }
}
@media (max-width: 900px) {
  /* The bar already holds the marks that turn the carousel, so the marks at the
     side of the chat are put away before they can stand over the words. */
  .turn-btn { display: none; }
}
@media (max-width: 860px) {
  .meter-box { width: 84px; }
  .meter-box .pct { display: none; }
  .keys { display: none; }
}
@media (max-width: 720px) {
  .spot .title { display: none; }
  .field { max-width: 158px; }
  .field select { max-width: 110px; }
  .bubble { max-width: 92%; }
  .col { padding: 0 16px; }
  .turn-btn.l { left: 6px; } .turn-btn.r { right: 6px; }
  .hello .mark { width: 48px; height: 48px; }
  .hello .greet { font-size: 15.5px; }
}
@media (max-width: 560px) {
  .meter-box { display: none; }
  .rule { display: none; }
}

/* A page that is asked for few moves keeps the row and the chat box still. */
@media (prefers-reduced-motion: reduce) {
  * { transition-duration: .01ms !important; }
  .turn.in { animation: none; }
  .caret, .ink, .pulse.busy, .state.run { animation: none; }
}
</style>
</head>
<body>

<!-- The bar: what the program runs on, the chat in use, and the two windows of
     settings. The groups are kept apart by a hairline. -->
<header class="bar">
  <div class="brand">
    <img class="mark" src="/autumn-natter.svg" alt="">
    <span class="word">Autumn Natter</span>
  </div>
  <span class="rule"></span>

  <label class="field" title="The model that answers. The settings of this model stand behind the chip mark at the right.">
    <svg class="svg" viewBox="0 0 16 16" aria-hidden="true"><rect x="4.2" y="4.2" width="7.6" height="7.6" rx="2"/><path d="M6.4 1.9v2.3M9.6 1.9v2.3M6.4 11.8v2.3M9.6 11.8v2.3M1.9 6.4h2.3M1.9 9.6h2.3M11.8 6.4h2.3M11.8 9.6h2.3"/></svg>
    <select id="model" aria-label="Model"></select>
    <span class="tag" id="kind"></span>
    <svg class="svg arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6.4 8 10.4 12 6.4"/></svg>
  </label>

  <label class="field" title="The place the chats of this window belong to. A command of the tool starts in that folder.">
    <svg class="svg" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.9 4.4c0-.6.4-1 1-1h3.3l1.4 1.8h5.5c.6 0 1 .4 1 1v5.3c0 .6-.4 1-1 1H2.9c-.6 0-1-.4-1-1z"/></svg>
    <select id="repo" aria-label="Repository"></select>
    <svg class="svg arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6.4 8 10.4 12 6.4"/></svg>
  </label>
  <button class="mark-btn" id="newrepo" title="New repository" aria-label="New repository">
    <svg class="svg" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.4v9.2M3.4 8h9.2"/></svg>
  </button>

  <div class="spot">
    <span class="title" id="title"></span>
    <span class="pager" id="pager">
      <button id="pgL" title="The chat on the left" aria-label="The chat on the left">
        <svg class="svg" viewBox="0 0 16 16" aria-hidden="true"><path d="M9.8 4.2 6 8l3.8 3.8"/></svg>
      </button>
      <span class="count" id="where"></span>
      <button id="pgR" title="The chat on the right" aria-label="The chat on the right">
        <svg class="svg" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.2 4.2 10 8l-3.8 3.8"/></svg>
      </button>
    </span>
  </div>

  <div class="meter-box" id="ctx" title="Tokens the model keeps in mind for this chat">
    <div class="row1">
      <span class="num" id="ctxtext">0 of 0</span>
      <span class="pct" id="ctxpct">0%</span>
    </div>
    <span class="meter"><i id="ctxfill"></i></span>
  </div>
  <span class="rule"></span>
  <button class="mark-btn" id="chatsbtn" title="Show the chats of this place (Alt)" aria-label="Show the chats">
    <svg class="svg" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.2" y="2.2" width="4.8" height="4.8" rx="1.2"/><rect x="9" y="2.2" width="4.8" height="4.8" rx="1.2"/><rect x="2.2" y="9" width="4.8" height="4.8" rx="1.2"/><rect x="9" y="9" width="4.8" height="4.8" rx="1.2"/></svg>
  </button>
  <button class="mark-btn" id="darkbtn" title="Switch to the dark colours" aria-label="Switch the colours">
    <svg class="svg" viewBox="0 0 16 16" aria-hidden="true"><path d="M13 9.8A5.4 5.4 0 0 1 6.2 3 5.7 5.7 0 1 0 13 9.8z"/></svg>
  </button>
</header>

<div class="area">

  <!-- The first screen: the mark, the line for this hour, and where the words
       are going. The chat box stands under them. -->
  <div class="hello">
    <img class="mark" src="/autumn-natter.svg" alt="">
    <div class="greet" id="greet"></div>
    <div class="where" id="homenote"></div>
  </div>

  <!-- The chat in use. The chats beside it are turned by the arrows here and by
       the row of small previews, and are not drawn beside it. -->
  <div class="stage" id="stage">
    <div class="thread" id="thread">
      <div class="col" id="col"></div>
    </div>
    <button class="turn-btn l hidden" id="turnL" title="The chat on the left" aria-label="The chat on the left">
      <svg class="svg" viewBox="0 0 16 16" aria-hidden="true"><path d="M9.8 4.2 6 8l3.8 3.8"/></svg>
    </button>
    <button class="turn-btn r hidden" id="turnR" title="The chat on the right" aria-label="The chat on the right">
      <svg class="svg" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.2 4.2 10 8l-3.8 3.8"/></svg>
    </button>

    <!-- The row of small previews. Alt brings it up over the chat. -->
    <div class="veil" id="veil">
      <div class="previews" id="previews"></div>
    </div>
    <div class="row-head" id="pcount"></div>
    <div class="row-foot">
      Click a card to open it. Drag, arrows, WASD or the wheel move along the row.
      <kbd>Escape</kbd> or <kbd>Alt</kbd> puts the row away.
    </div>
  </div>

  <!-- The chat box. The badges stand in a row of their own under the words, so
       no part of the box is left empty. -->
  <div class="dock" id="dock">
    <div class="box" id="box">
      <textarea id="draft" rows="1" spellcheck="false"
        placeholder="Write a message for the model"></textarea>
      <div class="dock-row">
        <div class="badges">
          <button class="badge" id="code" title="Let the model run one terminal command per step. Every command runs in the sandbox when the sandbox is on.">
            <svg class="svg" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.6 4.6 2.2 8l3.4 3.4M10.4 4.6 13.8 8l-3.4 3.4"/></svg>
            <span id="codetext">Code</span>
          </button>
          <button class="badge" id="sandbox" title="Run every terminal command inside a bubblewrap sandbox. Inside a repository, the commands start in the repository directory.">
            <svg class="svg" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.9 13.3 4v4.3c0 3.1-2 5-5.3 5.9-3.3-.9-5.3-2.8-5.3-5.9V4z"/></svg>
            <span id="sandboxtext">Sandbox</span>
          </button>
          <button class="badge static" id="think" title="The model shows its thinking before its answer. A click takes the next mode.">
            <svg class="svg" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.2a4 4 0 0 1 2.4 7.2v1.3H5.6V9.4A4 4 0 0 1 8 2.2zM6.3 13.3h3.4"/></svg>
            <span id="thinktext">think: auto</span>
          </button>
        </div>
        <span class="grow"></span>
        <span class="keys" id="hint"></span>
        <button class="send" id="send" title="Send" aria-label="Send">
          <svg class="svg" viewBox="0 0 16 16" aria-hidden="true">
            <path class="mark-send" d="M8 12.6V4M4.4 7.6 8 4l3.6 3.6"/>
            <path class="mark-stop" d="M5.4 5.4h5.2v5.2H5.4z"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="state-line">
      <span class="pulse" id="dot"></span>
      <span class="status" id="status"></span>
      <span class="grow"></span>
      <button class="quiet" id="newchat" title="Start a chat in this place">
        <svg class="svg" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.4v9.2M3.4 8h9.2"/></svg>
        New chat
      </button>
    </div>
  </div>

</div>

<script>'use strict';

// The page talks to the engine over the small HTTP server of the remote mode.
// The names of the calls match the routes the desktop window uses, so the two
// share one mapping on the Rust side.
function post(path, body) {
  fetch(path, {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify(body || {})
  }).then(function () { poll(); }, function () { poll(); });
}

// The parts of the page that stay in place. Their words are written again on
// every draw.
var ids = ['model', 'kind', 'repo', 'newrepo', 'title', 'pager', 'pgL', 'pgR', 'where',
  'ctx', 'ctxtext', 'ctxpct', 'ctxfill', 'stage', 'thread', 'col', 'turnL', 'turnR',
  'veil', 'previews', 'pcount', 'greet', 'homenote', 'dot', 'status', 'hint',
  'newchat', 'chatsbtn', 'darkbtn',
  'code', 'codetext', 'sandbox', 'sandboxtext', 'think', 'thinktext', 'draft', 'send',
  'box', 'dock'];
var el = {};
for (var i = 0; i < ids.length; i++) { el[ids[i]] = document.getElementById(ids[i]); }

// A touch screen leans on the round mark for send and for stop. A keyboard
// screen leans on Enter, and sees the mark too, because a mark that is not
// drawn cannot be found.
var touch = (window.matchMedia && window.matchMedia('(pointer: coarse)').matches)
  || ('ontouchstart' in window);
var reduce = !!(window.matchMedia
  && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

var rev = -1;          // what the page has seen last
var timer = null;      // the next poll
var pending = false;   // only one poll at a time
var cur = null;        // the last state
var stick = true;      // the words of the chat are followed while true
var lastChat = '';     // the chat the thread shows, to know which way it went
var lastIds = [];      // the chats of the draw before this one, for the same reason

function poll() {
  if (pending) { return; }
  pending = true;
  fetch('/api/state?since=' + rev)
    .then(function (r) { return r.json(); })
    .then(function (s) {
      rev = s.rev;
      if (!s.unchanged) { draw(s); }
      schedule(!!s.generating);
      pending = false;
    }, function () { schedule(false); pending = false; });
}

// A fast poll while an answer comes in, a slow one when nothing happens.
function schedule(fast) {
  clearTimeout(timer);
  timer = setTimeout(poll, fast ? 150 : 600);
}

// True when the bar has to give way, as the window does in a narrow box.
function tight() { return (document.documentElement.clientWidth || 640) < 860; }

// ---------------------------------------------------------------- draw
function draw(s) {
  cur = s;
  document.body.classList.toggle('dark', !!s.dark);
  el.darkbtn.title = s.dark ? 'Switch to the pale colours' : 'Switch to the dark colours';
  drawHome(s);
  fillSelect(el.model, s.models, s.model.id, function (m) { return m.name; });
  fillRepos(s);
  el.kind.textContent = s.model.kind;

  // The name of the chat in the middle of the bar.
  var blank = !s.chat.title || s.chat.title === 'No chat';
  el.title.textContent = blank ? (s.home ? 'No chat open' : 'New chat') : s.chat.title;
  el.title.classList.toggle('none', blank);

  drawContext(s);
  drawCarousel(s);
  drawBadges(s);

  // The line of state. The mark beats while the program is at work, and it
  // goes red while an answer can still be stopped.
  var busy = !!s.generating || !!s.busy;
  el.dot.className = 'pulse' + (busy ? ' busy' : '') + (s.generating ? ' stop' : '');
  el.status.textContent = s.status;
  el.status.className = 'status' + (s.generating ? ' hot' : '');
  el.hint.innerHTML = hintFor(s);
  el.newchat.style.display = s.generating ? 'none' : '';

  // The round mark. It is dull while there is nothing to send, and it turns
  // into the stop mark while an answer comes in.
  var live = !!s.generating || el.draft.value !== '';
  el.send.className = 'send' + (s.generating ? ' stop' : '') + (live ? ' live' : '');
  el.send.title = s.generating ? 'Stop the answer' : 'Send the message';

  drawThread(s);
  if (ov.on) { rowCount(s); buildPreviews(ov.pos); placePreviews(); }
}

// The meter of the context: the words in use, the whole room, and a bar.
function drawContext(s) {
  var ratio = Math.max(0, Math.min(1, s.context.ratio));
  el.ctxtext.textContent = tight()
    ? s.context.used + ' / ' + s.context.total
    : s.context.used + ' of ' + s.context.total;
  el.ctxpct.textContent = Math.round(ratio * 100) + '%';
  el.ctxfill.style.width = Math.round(ratio * 100) + '%';
  el.ctx.classList.toggle('near', ratio > 0.9);
  el.ctx.title = 'Tokens the model keeps in mind for this chat: '
    + s.context.used + ' of ' + s.context.total
    + (ratio > 0.9 ? '. The room is nearly full.' : '.');
}

// The three marks of the chat: the tool, the jail, and the thinking.
function drawBadges(s) {
  el.code.classList.toggle('on', !!s.code);
  el.sandbox.classList.toggle('on', !!s.sandbox);
  el.sandbox.classList.toggle('off', !!s.sandbox && !s.sandbox_available);
  el.sandbox.title = s.sandbox_available
    ? 'Run every terminal command inside a bubblewrap sandbox. Inside a repository, the commands start in the repository directory.'
    : 'bubblewrap (bwrap) was not found. Install it to sandbox the terminal tool.';
  var thinking = s.thinking || { mode: 'auto', available: false };
  el.thinktext.textContent = thinking.available
    ? 'think: ' + thinking.mode : 'no thinking modes';
  el.think.classList.toggle('on', thinking.available && thinking.mode !== 'auto');
  el.think.title = thinking.available
    ? 'The model shows its thinking before its answer. A click takes the next mode.'
    : 'The template of this model has no switch for thinking.';
}

// One line of keys next to the box. It says what the box needs at this moment.
function hintFor(s) {
  if (s && s.generating) { return '<kbd>Esc</kbd> stops the answer'; }
  if (document.activeElement === el.draft && el.draft.value === '') {
    return '<kbd>Enter</kbd> sends, <kbd>Shift</kbd> + <kbd>Enter</kbd> a new line';
  }
  return '<kbd>Alt</kbd> shows the chats';
}

// A list is built again only when its content changed. This keeps an open
// choice list of the browser from closing on every poll.
function fillSelect(sel, items, active, label) {
  var key = items.map(function (m) { return m.id; }).join('|') + '#' + active;
  if (sel.dataset.key === key) { return; }
  sel.dataset.key = key;
  sel.innerHTML = '';
  for (var n = 0; n < items.length; n++) {
    var option = document.createElement('option');
    option.value = items[n].id;
    // The kind stands on its own in the bar, so it is not put in the list too.
    option.textContent = label(items[n]);
    if (items[n].id === active) { option.selected = true; }
    sel.appendChild(option);
  }
}

function fillRepos(s) {
  var items = [{ id: '', name: 'No repository' }].concat(s.repositories);
  var key = items.map(function (r) { return r.id; }).join('|') + '#' + s.repository.id;
  if (el.repo.dataset.key === key) { return; }
  el.repo.dataset.key = key;
  el.repo.innerHTML = '';
  for (var n = 0; n < items.length; n++) {
    var option = document.createElement('option');
    option.value = items[n].id;
    option.textContent = items[n].name;
    if (items[n].id === s.repository.id) { option.selected = true; }
    el.repo.appendChild(option);
  }
}

// ---------------------------------------------------------------- first screen
// With no chat open the mark, the line for this hour and the chat box stand as
// one group in the middle of the room. The box slides between the two places
// without a jump: the place before the change is kept, and the box is slid from
// there to the place it has now.
function slidePart(part, change) {
  if (!part || reduce) { change(); return; }
  var before = part.getBoundingClientRect();
  change();
  var after = part.getBoundingClientRect();
  var dx = before.left - after.left;
  var dy = before.top - after.top;
  if (Math.abs(dx) < 1 && Math.abs(dy) < 1) { return; }
  part.style.transition = 'none';
  part.style.transform = 'translate(' + dx + 'px, ' + dy + 'px)';
  void part.offsetWidth;
  part.style.transition = 'transform 420ms cubic-bezier(.2, .7, .3, 1)';
  part.style.transform = '';
}

function drawHome(s) {
  var home = !!s.home;
  var was = document.body.classList.contains('home');
  el.greet.textContent = s.greeting || '';
  drawHomeNote(s);
  if (home === was) { return; }
  slidePart(el.dock, function () { document.body.classList.toggle('home', home); });
  if (home) { showRow(false); }
}

// One quiet line under the greeting: which model answers, how much room it has,
// and where the chats of this window belong.
function drawHomeNote(s) {
  el.homenote.innerHTML = '';
  addNoteBit(el.homenote, s.model.name, true);
  addNoteBit(el.homenote, s.model.kind, false);
  addNoteBit(el.homenote, s.context.total + ' tokens of room', false);
  addNoteBit(el.homenote, s.repository.id ? s.repository.name : 'loose chats', false);
}
function addNoteBit(box, text, first) {
  if (!text) { return; }
  if (!first) {
    var dot = document.createElement('span');
    dot.textContent = '  \u00b7  ';
    box.appendChild(dot);
  }
  var span = document.createElement('span');
  span.textContent = text;
  box.appendChild(span);
}


// ---------------------------------------------------------------- the words
//
// The stored words keep the marks of markdown. The window puts them in blocks
// of their own: a heading, a list, a block of code, and plain words. The marks
// of the words inside a block are taken out, so a bold word reads as a plain
// word and the address of a link stands after the words of the link. No mark
// reaches the reader.

// The words of a line with the marks of markdown taken out.
function plain(text) {
  var words = String(text || '');
  // Two passes, so a bold run with marks of its own inside loses all of them.
  for (var pass = 0; pass < 2; pass++) { words = stripOnce(words); }
  return words;
}

// One run over the words, with the marks taken out.
function stripOnce(text) {
  return text
    // A link gives its words where they fall, and its address follows them.
    .replace(/!\[([^\]]*)\]\(([^)\s]*)[^)]*\)/g, '$1 ($2)')
    .replace(/\[([^\]]*)\]\(([^)\s]*)[^)]*\)/g, '$1 ($2)')
    // An italic or a bold word keeps its words and loses its marks. The marks
    // go in pairs, so a lone mark in the middle of a file name stays.
    .replace(/\*\*\*([^*]+?)\*\*\*/g, '$1')
    .replace(/\*\*([^*]+?)\*\*/g, '$1')
    .replace(/___([^_]+?)___/g, '$1')
    .replace(/__([^_]+?)__/g, '$1')
    .replace(/(^|[^\w*])\*([^*\s][^*]*?)\*(?=[^\w*]|$)/g, '$1$2')
    .replace(/(^|[^\w])_([^_\s][^_]*?)_(?=[^\w]|$)/g, '$1$2')
    .replace(/~~([^~]+?)~~/g, '$1')
    // A piece of inline code keeps its words too.
    .replace(/`+/g, '')
    // HTML inside the words is dropped, so no tag can reach the page.
    .replace(/<[^>]*>/g, '');
}

// The blocks of one message. Each block has a kind and words of its own.
function blocks(text) {
  var lines = String(text || '').split('\n');
  var out = [];
  var para = [];
  var list = null;
  var fence = null;
  function flushPara() {
    var joined = para.join('\n').replace(/^\s+|\s+$/g, '');
    if (joined) { out.push({ kind: 'text', text: joined }); }
    para = [];
  }
  function flushList() {
    if (list && list.length) { out.push({ kind: 'list', items: list.slice() }); }
    list = null;
  }
  for (var n = 0; n < lines.length; n++) {
    var line = lines[n];
    var cut = line.replace(/^\s*/, '');
    if (fence !== null) {
      if (/^```/.test(cut)) {
        out.push({ kind: 'code', text: fence.join('\n').replace(/\s+$/, '') });
        fence = null;
      } else {
        fence.push(line);
      }
      continue;
    }
    if (/^```/.test(cut)) { flushList(); flushPara(); fence = []; continue; }
    var head = /^(#{1,6})\s+(.*)$/.exec(cut);
    if (head) {
      flushList(); flushPara();
      out.push({ kind: 'heading', text: plain(head[2]), level: head[1].length });
      continue;
    }
    var item = /^[-*+]\s+(.*)$/.exec(cut);
    if (item) {
      flushPara();
      if (!list) { list = []; }
      list.push({ text: plain(item[1]), ordered: false });
      continue;
    }
    var numbered = /^(\d+)[.)]\s+(.*)$/.exec(cut);
    if (numbered) {
      flushPara();
      if (!list) { list = []; }
      list.push({ text: plain(numbered[2]), ordered: true });
      continue;
    }
    if (!cut) { flushList(); flushPara(); continue; }
    flushList();
    para.push(plain(line));
  }
  if (fence !== null) { out.push({ kind: 'code', text: fence.join('\n').replace(/\s+$/, '') }); }
  flushList();
  flushPara();
  return out;
}

// The first line of a command, for the head of the tool panel.
function firstLine(text) {
  var lines = String(text || '').split('\n');
  return lines.length ? lines[0] : '';
}

function make(tag, cls) {
  var node = document.createElement(tag);
  if (cls) { node.className = cls; }
  return node;
}

// A picture made in the page, so no file is read for a mark.
function mark(path, cls) {
  var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 16 16');
  svg.setAttribute('aria-hidden', 'true');
  svg.setAttribute('class', 'svg' + (cls ? ' ' + cls : ''));
  var p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', path);
  svg.appendChild(p);
  return svg;
}

// The mark of the thinking panel. The answer that is coming in needs it too.
var THINK_MARK = 'M8 2.2a4 4 0 0 1 2.4 7.2v1.3H5.6V9.4A4 4 0 0 1 8 2.2zM6.3 13.3h3.4';

// The thinking of the model: a look inside the answer, kept small, behind a
// rule of colour, and cut off at a height the reader can move in.
function thinkingBox(m) {
  var box = make('div', 'think');
  var cap = make('div', 'cap');
  cap.appendChild(mark(THINK_MARK));
  var label = make('span');
  label.textContent = 'Thinking';
  cap.appendChild(label);
  var words = make('div', 'words');
  words.textContent = m.reasoning;
  box.appendChild(cap);
  box.appendChild(words);
  return box;
}

// One run of the terminal tool. The head says which command runs, or has run,
// and what became of it. The body keeps the command and the output under their
// own small labels, each cut off at a height. A run with no output yet keeps
// the panel, so the wait shows.
function toolBox(m) {
  var running = m.tool === 'running ...';
  var panel = make('div', 'tool' + (m.failed ? ' bad' : ''));

  var head = make('button', 'thead');
  head.type = 'button';
  head.appendChild(mark(running
    ? 'M2.4 3.2h11.2v9.6H2.4zM4.6 6.4 6.6 8l-2 1.6M8.2 10.2h3.2'
    : 'M2.4 3.2h11.2v9.6H2.4zM4.6 6.4 6.6 8l-2 1.6M8.2 10.2h3.2'));
  var cmd = make('span', 'cmd');
  cmd.textContent = firstLine(m.body) || 'a command with no words';
  head.appendChild(cmd);
  var state = make('span', 'state' + (running ? ' run' : '') + (m.failed ? ' fail' : ''));
  state.textContent = running ? 'running' : (m.failed ? 'failed' : 'done');
  head.appendChild(state);
  head.appendChild(mark('M4 6.4 8 10.4 12 6.4', 'fold'));
  // The fold is of this panel alone, so it is lost when the row is made again.
  head.addEventListener('click', function () { panel.classList.toggle('closed'); });

  var body = make('div', 'tbody');
  body.appendChild(make('span', 'rail'));
  var space = make('div', 'tspace');
  var labOne = make('div', 'lab');
  labOne.textContent = 'command';
  var commandText = make('pre', 'cmd-text');
  commandText.textContent = m.body;
  var labTwo = make('div', 'lab');
  labTwo.textContent = 'output';
  var output = make('pre', 'out' + (running ? ' live' : ''));
  output.textContent = m.tool;
  space.appendChild(labOne);
  space.appendChild(commandText);
  space.appendChild(labTwo);
  space.appendChild(output);
  body.appendChild(space);

  panel.appendChild(head);
  panel.appendChild(body);
  return panel;
}

// The class of a turn says who spoke. The words 't-you' and the like keep the
// name apart from the parts that stand inside the turn, so a rule for a part
// cannot reach the turn of the same name.
function roleClass(m) {
  if (m.role === 'You') { return 't-you'; }
  if (m.role === 'Tool') { return 't-tool'; }
  if (m.role === 'Note') { return 't-note'; }
  return 't-ai';
}

// One block of words, as the window sets it.
function blockNode(block) {
  if (block.kind === 'heading') {
    var level = Math.max(1, Math.min(6, block.level || 1));
    var head = make('div', 'h l' + level);
    var span = make('span');
    span.textContent = block.text;
    head.appendChild(span);
    return head;
  }
  if (block.kind === 'list') {
    var ordered = false;
    for (var n = 0; n < block.items.length; n++) { if (block.items[n].ordered) { ordered = true; } }
    var list = make(ordered ? 'ol' : 'ul', 'marks');
    for (var m = 0; m < block.items.length; m++) {
      var li = make('li');
      li.textContent = block.items[m].text;
      list.appendChild(li);
    }
    return list;
  }
  if (block.kind === 'code') {
    var code = make('pre', 'code');
    code.textContent = block.text;
    return code;
  }
  var text = make('div', 'body');
  text.textContent = block.text;
  return text;
}

// ------------------------------------------------------------ the live answer
//
// The engine gives the words of an answer in pieces, and the page asks for the
// state about six times a second. Put on the page as they arrive, the words
// would pop in. They stand behind a writer instead: the writer puts a few
// characters at a time, and every new run fades in, so an answer reads as one
// movement and not as a stack of jumps.
var ink = {
  turn: null,       // the turn of the answer that is coming in
  panel: null,      // the panel of the thinking, kept out while there is none
  thought: null,    // the words of the thinking
  words: null,      // where the words of the answer stand
  caret: null,      // the mark that says the answer is not over
  said: '',         // all the words the engine has given
  musing: '',       // all the thinking the engine has given
  shown: 0,         // how much of the words stands on the page
  shownMusing: 0,   // how much of the thinking stands on the page
  shape: '',        // the blocks the words stand in
  frame: 0,         // the next look of the writer, or nothing
  clock: 0          // when the page was written last
};

// The blocks of an answer as one line, so a change of shape is seen at once.
function shapeOf(made) {
  var parts = [];
  for (var n = 0; n < made.length; n++) {
    var block = made[n];
    parts.push(block.kind + (block.level || 0) + (block.items ? block.items.length : 0));
  }
  return parts.join(' ');
}

// The words of the last block. Only that block can still grow.
function tailText(made) {
  if (!made.length) { return ''; }
  var last = made[made.length - 1];
  if (last.kind === 'list') { return last.items[last.items.length - 1].text; }
  return last.text || '';
}

// The node of the last block. The mark of an answer that is still coming is
// left out, so it is never taken for a block of words.
function lastBlock(node) {
  var child = node.lastElementChild;
  if (child === ink.caret) { child = child.previousElementSibling; }
  return child;
}

// The node inside a block that holds the words which can still grow.
function holderOf(node) {
  if (!node) { return null; }
  if (node.tagName === 'UL' || node.tagName === 'OL') { return node.lastChild; }
  if (node.classList.contains('h')) { return node.lastChild; }
  return node;
}

// New words go in behind a fade.
function fresh(node, text) {
  if (!node || !text) { return; }
  if (reduce) { node.appendChild(document.createTextNode(text)); return; }
  var span = make('span', 'ink');
  span.textContent = text;
  node.appendChild(span);
}

// Words that have finished fading are plain words again, so a long answer does
// not leave a span for every few characters.
function settle(node) {
  if (reduce || !node) { return; }
  var spans = node.querySelectorAll('.ink');
  for (var n = 0; n + 8 < spans.length; n++) {
    spans[n].replaceWith(document.createTextNode(spans[n].textContent));
  }
  node.normalize();
}

// The words of the answer that is coming in, put on the page. A block that came
// in is made again; a block that only grew takes the new words at its end.
function writeSaid() {
  var node = ink.words;
  if (!node) { return; }
  var made = blocks(ink.said.slice(0, ink.shown));
  var shape = shapeOf(made);
  var want = tailText(made);
  var holder;
  if (shape !== ink.shape) {
    ink.shape = shape;
    node.innerHTML = '';
    for (var n = 0; n < made.length; n++) { node.appendChild(blockNode(made[n])); }
    holder = holderOf(lastBlock(node));
    if (holder && want) { holder.textContent = ''; fresh(holder, want); }
  } else if (made.length) {
    holder = holderOf(lastBlock(node));
    if (holder) {
      var have = holder.textContent;
      if (want.length > have.length && want.slice(0, have.length) === have) {
        fresh(holder, want.slice(have.length));
      } else {
        holder.textContent = want;
      }
    }
  }
  // The mark of an answer that is not over stands behind the last words, and
  // not on a line of its own when those words are plain words.
  var home = (holder && holder.classList.contains('body')) ? holder : node;
  if (ink.caret && ink.caret.parentNode !== home) { home.appendChild(ink.caret); }
  settle(node);
}

// The thinking of the answer that is coming in, put on the page.
function writeThought() {
  var node = ink.thought;
  if (!node) { return; }
  var want = ink.musing.slice(0, ink.shownMusing);
  var have = node.textContent;
  if (want.length > have.length && want.slice(0, have.length) === have) {
    fresh(node, want.slice(have.length));
  } else if (want !== have) {
    node.textContent = want;
  }
  settle(node);
  // The end of the thinking is what matters while it comes in, unless the
  // reader has gone up in the panel to read the start of it.
  if (node.scrollHeight - (node.scrollTop + node.clientHeight) < 60) {
    node.scrollTop = node.scrollHeight;
  }
}

// One look of the writer. A few characters go on the page, and more of them
// while the model is ahead of the reader.
function stepInk(now) {
  ink.frame = 0;
  if (!ink.words) { return; }
  if (now - ink.clock < 26) { ink.frame = requestAnimationFrame(stepInk); return; }
  ink.clock = now;
  var room = ink.said.length - ink.shown;
  if (room > 0) {
    ink.shown += reduce ? room : Math.min(140, Math.max(2, Math.ceil(room / 5)));
    writeSaid();
  }
  var musing = ink.musing.length - ink.shownMusing;
  if (musing > 0) {
    ink.shownMusing += reduce ? musing : Math.min(200, Math.max(3, Math.ceil(musing / 5)));
    writeThought();
  }
  if (stick) { el.thread.scrollTop = el.thread.scrollHeight; }
  if (ink.shown < ink.said.length || ink.shownMusing < ink.musing.length) {
    ink.frame = requestAnimationFrame(stepInk);
  }
}

// The state has new words for the answer that is coming in.
function feedInk(m) {
  ink.said = String(m.body || '');
  ink.musing = String(m.reasoning || '');
  if (ink.panel && ink.musing) { ink.panel.classList.remove('hidden'); }
  if (!ink.frame) {
    ink.clock = 0;
    ink.frame = requestAnimationFrame(stepInk);
  }
}

// The answer is over, or another chat stands in the way of the writer.
function stopInk() {
  if (ink.frame) { cancelAnimationFrame(ink.frame); }
  ink.turn = null; ink.panel = null; ink.thought = null; ink.words = null;
  ink.caret = null; ink.said = ''; ink.musing = ''; ink.shown = 0;
  ink.shownMusing = 0; ink.shape = ''; ink.frame = 0;
}

// The turn of an answer that is coming in. What the engine has given so far
// stands on the page at once; what comes after that the writer puts on slowly.
function fillLive(turn, m) {
  turn.className = 'turn t-ai';
  turn.innerHTML = '';
  stopInk();
  var panel = make('div', 'think' + (m.reasoning ? '' : ' hidden'));
  var cap = make('div', 'cap');
  cap.appendChild(mark(THINK_MARK));
  var label = make('span');
  label.textContent = 'Thinking';
  cap.appendChild(label);
  var thought = make('div', 'words');
  panel.appendChild(cap);
  panel.appendChild(thought);
  turn.appendChild(panel);
  var plain = make('div', 'plain');
  turn.appendChild(plain);
  ink.turn = turn; ink.panel = panel; ink.thought = thought;
  ink.words = plain; ink.caret = make('span', 'caret');
  plain.appendChild(ink.caret);
  ink.said = String(m.body || '');
  ink.musing = String(m.reasoning || '');
  ink.shown = ink.said.length;
  ink.shownMusing = ink.musing.length;
  writeSaid();
  if (ink.musing) { writeThought(); }
}

// The words of one message, put into a turn. The turn is made once, and the
// words of an answer that is coming in are put again by the writer above.
function fill(turn, m) {
  turn.className = 'turn ' + roleClass(m) + (m.failed ? ' bad' : '');
  turn.innerHTML = '';
  if (m.role === 'Note') {
    // A note from the program stands in the middle, between two hairlines,
    // with no bubble around it.
    var note = make('div', 'note');
    note.textContent = m.body;
    turn.appendChild(note);
    return;
  }
  if (m.role === 'Tool' && m.tool !== '') {
    // A turn that only asked for a command has no words of its own. Its
    // thinking stands above the command it led to.
    if (m.reasoning) {
      var thought = make('div', 'plain');
      thought.appendChild(thinkingBox(m));
      turn.appendChild(thought);
    }
    turn.appendChild(toolBox(m));
  } else {
    var words = make('div', m.role === 'You' ? 'bubble' : 'plain');
    if (m.reasoning) { words.appendChild(thinkingBox(m)); }
    if (m.role === 'You') {
      // The words of the user stand as they were written, marks and all.
      var said = make('div', 'body');
      said.textContent = m.body;
      words.appendChild(said);
    } else {
      var made = blocks(m.body);
      for (var n = 0; n < made.length; n++) { words.appendChild(blockNode(made[n])); }
    }
    turn.appendChild(words);
  }
  if (m.when) {
    var when = make('div', 'stamp');
    when.textContent = m.when;
    turn.appendChild(when);
  }
}

function roleStamp(m) {
  return [m.role, m.body.length, m.reasoning ? m.reasoning.length : 0,
    (m.tool || '').length, m.tool === 'running ...' ? 1 : 0, m.when || ''].join('#');
}

// The chat box holds one turn for every message. A turn is made once and then
// only the words of the last turn are put again, so a message that came in
// fades up and an answer that grows does not shake the page.
function drawThread(s) {
  var box = el.col;
  var items = s.messages.slice();
  if (s.generating) {
    items.push({
      id: 'live', role: 'Assistant', body: s.live || '', reasoning: s.reasoning || '',
      tool: '', mono: false, failed: false, when: ''
    });
  }
  if (items.length === 0) {
    stopInk();
    if (box.dataset.key !== 'blank') {
      box.dataset.key = 'blank';
      box.innerHTML = '';
      var blank = make('div', 'empty');
      var strong = make('b');
      strong.textContent = 'Nothing written yet';
      var rest = make('span');
      rest.textContent = 'Write below and press Enter. A chat with nothing in it '
        + 'goes away when you turn the carousel.';
      blank.appendChild(strong);
      blank.appendChild(rest);
      box.appendChild(blank);
    }
    return;
  }
  var key = items.map(function (m) { return m.id; }).join('|');
  if (box.dataset.key !== key) {
    var had = Number(box.dataset.count || 0);
    box.dataset.key = key;
    box.dataset.count = items.length;
    box.innerHTML = '';
    for (var n = 0; n < items.length; n++) {
      var turn = make('div', 'turn');
      if (items[n].id === 'live') { fillLive(turn, items[n]); } else { fill(turn, items[n]); }
      turn.dataset.stamp = roleStamp(items[n]);
      // Only the turn that came in fades up. A chat that was opened is already
      // there, and its turns do not need to say so again.
      if (n === items.length - 1 && items.length > had && !reduce) { turn.classList.add('in'); }
      box.appendChild(turn);
    }
    // A chat that was opened or turned stands at the top.
    el.thread.scrollTop = 0;
    stick = true;
  } else {
    // The last turn is the one that can still grow.
    var last = box.lastChild;
    var tail = items[items.length - 1];
    if (tail.id === 'live') {
      // An answer that is coming in is written a few characters at a time by
      // the writer, so the words flow instead of arriving in jumps.
      feedInk(tail);
    } else {
      stopInk();
      var stamp = roleStamp(tail);
      if (last && last.dataset.stamp !== stamp) {
        last.dataset.stamp = stamp;
        fill(last, tail);
      }
    }
  }
  if (stick) { el.thread.scrollTop = el.thread.scrollHeight; }
}

// The words of the chat are followed while the reader stands near the bottom,
// and left alone when the reader has gone up to read.
el.thread.addEventListener('scroll', function () {
  var box = el.thread;
  stick = box.scrollHeight - (box.scrollTop + box.clientHeight) < 90;
});

// ---------------------------------------------------------------- carousel
//
// The chats of one place stand in a carousel inside the engine, and the chat in
// the middle is the chat in use. This window draws only that chat: the chats
// beside it are seen in the row of small previews. Turning the carousel slides
// the chat out of the way and the next one in.
function drawCarousel(s) {
  var count = s.chats.length;
  var index = s.carousel ? s.carousel.index : 0;
  var left = index > 0;
  var right = index < count - 1;

  el.turnL.classList.toggle('hidden', !left);
  el.turnR.classList.toggle('hidden', !right);
  el.pager.classList.toggle('hidden', count < 2);
  el.pgL.disabled = !left;
  el.pgR.disabled = !right;
  el.where.textContent = count > 1 ? (index + 1) + ' of ' + count : '';

  // The chat changed, so the new one is slid in from the side the old one stood
  // at. The number is taken from the list of the draw before this one, because
  // the state in hand has already moved.
  if (s.chat.id !== lastChat) {
    var was = indexOfId(lastIds, lastChat);
    var forward = was < 0 ? true : index >= was;
    if (lastChat && !s.home) { slideChat(forward ? 1 : -1); }
    lastChat = s.chat.id || '';
  }
  lastIds = s.chats.map(function (c) { return c.id; });
}

// Which place an id sits at in a list of ids, or -1 when it is gone.
function indexOfId(ids, id) {
  for (var n = 0; n < ids.length; n++) { if (ids[n] === id) { return n; } }
  return -1;
}

// The chat is slid in from the side the carousel was turned to.
function slideChat(direction) {
  if (reduce) { return; }
  var from = direction > 0 ? 26 : -26;
  el.col.style.animation = 'none';
  void el.col.offsetWidth;
  el.col.style.animation = 'slide ' + (260) + 'ms ease-out';
  el.col.style.setProperty('--from', from + 'px');
}


// ---------------------------------------------------------------- the row
//
// The Alt key or the mark in the bar turns the chats of this place into a row
// of small previews over the chat. One click on a preview opens that chat. The
// arrows, A and D, a drag, a flick and the wheel move along the row. A count of
// the chats stands above the row, and a line of keys stands under it.

// The state of the row. The place of every preview is worked out from these
// numbers on every frame, so nothing is built again while the row moves.
var ov = {
  on: false,     // true while the row is up
  pos: 0,        // where the row stands, counted in previews
  target: 0,     // where the row wants to rest
  speed: 0,      // previews for every frame, from a flick
  open: 1,       // 0 to 1 while the row settles after it came up
  drag: false,   // true while the pointer holds the row
  from: 0,       // where the row stood when the pointer went down
  pointer: 0,    // where the pointer was when it went down
  last: 0,       // where the pointer stood in the last move
  flick: 0,      // speed of the last move, in previews for one frame
  frame: 0,      // the frame that is planned, or 0 for none
  pressed: -1    // which preview the pointer went down on, or -1
};

// Space between two previews.
var PREV_GAP = 18;

// How many chats this place holds.
function chatCount() { return cur && cur.chats ? cur.chats.length : 0; }

// The chat the carousel stands on.
function chatIndex() { return cur && cur.carousel ? cur.carousel.index : 0; }

// Keeps a chat number inside the list of this place.
function keepInside(value) { return Math.max(0, Math.min(chatCount() - 1, value)); }

// The line above the row: how many chats this place holds, and where they are.
function rowCount(s) {
  el.pcount.innerHTML = '';
  var strong = make('b');
  var n = s.chats.length;
  strong.textContent = n === 0 ? 'This place holds no chat yet'
    : n + ' ' + (n === 1 ? 'chat' : 'chats');
  el.pcount.appendChild(strong);
  if (n > 0) {
    var at = make('span', 'at');
    at.textContent = ' in ' + (s.repository.id ? s.repository.name : 'the loose chats of this machine')
      + '. ' + (chatIndex() + 1) + ' is open.';
    el.pcount.appendChild(at);
  }
}

// Width of one preview, and the step from one preview to the next.
function prevWidth() {
  var width = el.stage.clientWidth || 640;
  return Math.max(158, Math.min(232, (width - 60) / 4));
}
function prevStep() { return prevWidth() + PREV_GAP; }

// The previews are made once and only moved after that. Only the fifteen about
// the chat in use are made, so a place with a hundred chats stays light to draw.
function buildPreviews(centre) {
  var start = Math.max(0, Math.min(Math.max(0, chatCount() - 15),
      Math.round(keepInside(centre)) - 7));
  var stop = Math.min(chatCount(), start + 15);
  var key = start + '-' + stop + '-'
    + cur.chats.slice(start, stop).map(function (c) { return c.id; }).join('|');
  if (el.previews.dataset.key === key) { return; }
  el.previews.dataset.key = key;
  el.previews.innerHTML = '';
  for (var n = start; n < stop; n++) {
    // A plain div, and not a button: the box of a form control puts its words
    // in the middle of itself, which is the wrong place for a preview.
    var card = make('div', 'prev');
    card.setAttribute('role', 'button');
    card.setAttribute('tabindex', '0');
    card.dataset.n = n;
    card.dataset.id = cur.chats[n].id;
    var title = make('div', 'pt');
    title.textContent = cur.chats[n].title;
    var line = make('div', 'pp');
    line.textContent = cur.chats[n].preview || 'Nothing written yet';
    var foot = make('div', 'pw');
    var repo = make('span', 'rn');
    repo.textContent = cur.chats[n].repo || '';
    var when = make('span');
    when.textContent = cur.chats[n].when || '';
    foot.appendChild(repo);
    foot.appendChild(when);
    card.appendChild(title);
    card.appendChild(line);
    card.appendChild(foot);
    el.previews.appendChild(card);
  }
}

// Stand the previews in their place. Only the place, the size and the strength
// of a card change, which is what keeps the motion smooth.
function placePreviews() {
  var step = prevStep();
  var width = prevWidth();
  var height = Math.round(width * 1.18);
  var centre = (el.stage.clientWidth - width) / 2;
  // The room of the row is the height of a card, so the row stands in the
  // middle of the stage whatever the size of the window.
  el.previews.style.height = height + 'px';
  el.previews.style.marginTop = (-height / 2) + 'px';
  // The row comes up big and shrinks into place, which is the look of a scale
  // that goes from 1.6 down to 1.
  var settle = 1 + (1 - ov.open) * 0.6;
  var middle = Math.round(ov.pos);
  var cards = el.previews.children;
  for (var n = 0; n < cards.length; n++) {
    var at = Number(cards[n].dataset.n);
    var x = centre + (at - ov.pos) * step;
    var on = at === middle;
    cards[n].style.width = width + 'px';
    cards[n].style.height = height + 'px';
    cards[n].style.transform = 'translate(' + x.toFixed(1) + 'px, 0) scale('
      + settle.toFixed(3) + ')';
    cards[n].style.opacity = (ov.open * (on ? 1 : 0.62)).toFixed(3);
    cards[n].classList.toggle('mid', on);
  }
}

// One frame of the row. A flick keeps gliding and gives a little speed back on
// every frame, and the row then settles on the nearest preview.
function stepRow() {
  ov.frame = 0;
  var last = Math.max(0, chatCount() - 1);
  if (ov.open < 1) { ov.open = Math.min(1, ov.open + 0.07); }
  if (!ov.drag) {
    if (Math.abs(ov.speed) > 0.008 && !reduce) {
      ov.pos += ov.speed;
      ov.speed *= 0.94;
      // At an end there is nothing left to see, so the row stops there.
      if (ov.pos < 0) { ov.pos = 0; ov.speed = 0; }
      if (ov.pos > last) { ov.pos = last; ov.speed = 0; }
      ov.target = keepInside(Math.round(ov.pos));
    } else {
      ov.speed = 0;
      var gap = ov.target - ov.pos;
      if (Math.abs(gap) < 0.004) { ov.pos = ov.target; } else { ov.pos += gap * 0.22; }
    }
  }
  placePreviews();
  var still = ov.speed === 0 && ov.pos === ov.target && ov.open >= 1;
  if (ov.on && !still) { runRow(); }
}

// Ask for the next frame, once.
function runRow() {
  if (ov.on && !ov.frame) { ov.frame = requestAnimationFrame(stepRow); }
}

// Bring the row up, or put it away again.
function showRow(on) {
  if (on === ov.on) { return; }
  ov.on = on;
  el.veil.classList.toggle('on', on);
  el.chatsbtn.classList.toggle('on', on);
  document.body.classList.toggle('rowon', on);
  if (!on) {
    if (ov.frame) { cancelAnimationFrame(ov.frame); ov.frame = 0; }
    ov.drag = false;
    return;
  }
  ov.pos = chatIndex();
  ov.target = chatIndex();
  ov.speed = 0;
  ov.open = reduce ? 1 : 0;
  ov.drag = false;
  ov.pressed = -1;
  if (cur) { rowCount(cur); }
  buildPreviews(ov.pos);
  placePreviews();
  runRow();
}

// One step with the keys. A key always moves the row, so the middle preview
// changes even when the row stood on a preview edge.
function rowStep(step) {
  ov.speed = 0;
  ov.target = keepInside(Math.round(ov.target) + step);
  if (reduce) { ov.pos = ov.target; }
  runRow();
}

// Open one chat of the row. Without a number, the chat in the middle is opened.
function pickRow(at) {
  var n = at === undefined ? Math.round(ov.pos) : keepInside(Math.round(at));
  if (!cur || !cur.chats[n]) { return; }
  showRow(false);
  openChat(cur.chats[n].id);
}

// The pointer went down on the row.
el.previews.addEventListener('pointerdown', function (event) {
  var card = event.target.closest ? event.target.closest('.prev') : null;
  ov.pressed = card ? Number(card.dataset.n) : -1;
  ov.drag = true;
  ov.from = ov.pos;
  ov.pointer = event.clientX;
  ov.last = event.clientX;
  ov.flick = 0;
  ov.speed = 0;
  if (el.previews.setPointerCapture) { el.previews.setPointerCapture(event.pointerId); }
  runRow();
});

// The pointer moved while the row was held down, so the row follows it and a
// preview stays under the pointer.
el.previews.addEventListener('pointermove', function (event) {
  if (!ov.drag) { return; }
  var step = prevStep();
  ov.flick = (event.clientX - ov.last) / step;
  ov.last = event.clientX;
  var last = Math.max(0, chatCount() - 1);
  // A drag to the right brings the chats that came before, so the count of the
  // row goes the other way.
  ov.pos = Math.max(-0.6, Math.min(last + 0.6,
      ov.from - (event.clientX - ov.pointer) / step));
  ov.target = keepInside(Math.round(ov.pos));
  runRow();
});

// The pointer let go. A short press that did not move opens the preview it stood
// on. A flick keeps gliding until the row settles.
el.previews.addEventListener('pointerup', function (event) {
  if (!ov.drag) { return; }
  ov.drag = false;
  var moved = Math.abs(event.clientX - ov.pointer);
  var stood = ov.pressed;
  ov.pressed = -1;
  if (moved < 6) {
    if (stood >= 0) { pickRow(stood); } else { runRow(); }
    return;
  }
  ov.speed = Math.max(-0.6, Math.min(0.6, -ov.flick));
  runRow();
});

el.previews.addEventListener('pointercancel', function () {
  ov.drag = false;
  runRow();
});

// The wheel moves along the row.
el.previews.addEventListener('wheel', function (event) {
  event.preventDefault();
  var down = Math.abs(event.deltaY) >= Math.abs(event.deltaX) ? event.deltaY : event.deltaX;
  rowStep(down > 0 ? 1 : -1);
}, { passive: false });

// The keys of the row. Alt brings the row up or takes it away, Escape puts it
// away, the arrows and A and D move along it, and Enter opens the middle preview.
document.addEventListener('keydown', function (event) {
  if (event.key === 'Alt') {
    event.preventDefault();
    showRow(!ov.on);
    return;
  }
  if (!ov.on) { return; }
  if (event.key === 'Escape') { showRow(false); return; }
  if (event.key === 'ArrowLeft' || event.key === 'a') { rowStep(-1); return; }
  if (event.key === 'ArrowRight' || event.key === 'd') { rowStep(1); return; }
  if (event.key === 'Enter') { pickRow(); return; }
  // Nothing else reaches the chat box while the row is up.
  if (event.key !== 'Tab') { event.preventDefault(); }
});

// ---------------------------------------------------------------- the box
//
// The box grows with the words, up to a height. The round mark knows whether
// there is anything to send, and turns into the stop mark while an answer comes.
function grow() {
  el.draft.style.height = 'auto';
  el.draft.style.height = Math.min(el.draft.scrollHeight, window.innerHeight * 0.4) + 'px';
  if (cur) {
    var live = el.draft.value !== '' || !!cur.generating;
    el.send.classList.toggle('live', live && !cur.generating);
    el.hint.innerHTML = hintFor(cur);
  }
}

function send() {
  var text = el.draft.value.trim();
  if (!text) { return; }
  el.draft.value = '';
  grow();
  post('/api/send', { text: text });
}

el.send.addEventListener('click', function () {
  if (cur && cur.generating) { post('/api/cancel'); return; }
  send();
});
el.newchat.addEventListener('click', function () { post('/api/new_chat'); });
el.chatsbtn.addEventListener('click', function () { showRow(!ov.on); });
el.turnL.addEventListener('click', function () { roll(-1); });
el.turnR.addEventListener('click', function () { roll(1); });
el.pgL.addEventListener('click', function () { roll(-1); });
el.pgR.addEventListener('click', function () { roll(1); });
// A new window size changes the shape of the bar and the width of the row.
window.addEventListener('resize', function () {
  if (cur) { draw(cur); }
  if (ov.on) { buildPreviews(ov.pos); placePreviews(); }
});
el.model.addEventListener('change', function (e) { post('/api/select_model', { id: e.target.value }); });
el.repo.addEventListener('change', function (e) { post('/api/select_repository', { id: e.target.value }); });
el.newrepo.addEventListener('click', function () {
  // The page has no window of settings, so the name is asked for in the plain
  // way. The desktop window stands the field in its own sheet instead.
  var name = window.prompt('Name of the new repository');
  if (name && name.trim()) { post('/api/create_repository', { name: name.trim() }); }
});
el.code.addEventListener('click', function () { if (cur) { post('/api/code', { on: !cur.code }); } });
el.sandbox.addEventListener('click', function () { if (cur) { post('/api/sandbox', { on: !cur.sandbox }); } });
el.think.addEventListener('click', function () { if (cur && cur.thinking && cur.thinking.available) { post('/api/thinking'); } });
el.darkbtn.addEventListener('click', function () { post('/api/dark', { on: !(cur && cur.dark) }); });
el.draft.addEventListener('input', grow);
el.draft.addEventListener('focus', function () {
  el.box.classList.add('focus'); grow();
});
el.draft.addEventListener('blur', function () {
  el.box.classList.remove('focus');
  if (cur) { el.hint.innerHTML = hintFor(cur); }
});

el.draft.addEventListener('keydown', function (e) {
  // While the row of previews is up, the row takes every key.
  if (ov.on) { return; }
  if (e.key === 'Enter' && !e.shiftKey && !touch) {
    e.preventDefault();
    send();
  } else if (e.key === 'Escape') {
    post('/api/cancel');
  }
});

function roll(step) { post('/api/roll', { step: step }); }
function openChat(id) { post('/api/open_chat', { id: id }); }


// The box holds the keys from the first look, as the window always did.
grow();
poll();
window.setTimeout(function () { el.draft.focus(); }, 60);
</script>
</body>
</html>
