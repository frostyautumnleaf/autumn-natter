<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autumn Natter</title>
<style>
:root {
  --bg: #faf2e6; --surface: #fffbf4; --line: #e6d9c7; --text: #2a2118; --dim: #7b6a5a;
  --accent: #ED7401; --strong: #C53C01; --ink: #AC4422; --warm: #DF6101; --deep: #AF2600;
  --tint: #fbe6d2; --fade: rgba(250, 242, 230, 1);
}
body.dark {
  --bg: #141414; --surface: #1c1917; --line: #342c24; --text: #f1e7d9; --dim: #a3927f;
  --tint: #2b1d12; --fade: rgba(20, 20, 20, 1);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.45 system-ui, "Segoe UI", sans-serif;
  display: flex; flex-direction: column;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
select, input, textarea {
  font: inherit; background: var(--bg); color: var(--text);
  border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px;
}
:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.grow { flex: 1 1 auto; }

/* Top bar: model, repository, chat name and the context meter. */
.top {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 9px 12px; background: var(--surface); border-bottom: 1px solid var(--line);
}
.logo { width: 22px; height: 22px; }
.name { font-weight: 600; color: var(--strong); }
.ctl { display: flex; align-items: center; gap: 5px; }
.tag {
  font-size: 11px; color: var(--dim); border: 1px solid var(--line);
  border-radius: 999px; padding: 1px 7px;
}
.title { color: var(--text); font-size: 13px; max-width: 30ch; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
/* Where the user stands in the carousel, for example 3 of 9. */
.where { font-size: 12px; color: var(--dim); white-space: nowrap; }
.ctx { min-width: 140px; font-size: 12px; color: var(--dim); }
.bar { display: block; height: 4px; margin-top: 3px; border-radius: 2px;
  background: var(--line); overflow: hidden; }
.fill { display: block; height: 100%; background: var(--accent); }

/* The carousel of chats. The card in the middle is the chat in use, and the
   next chats of this place show a little of themselves at each side. Every
   repository has a carousel of its own. */
.area { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; }
.stage { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; }
.card { position: absolute; top: 10px; bottom: 10px; left: 50%;
  width: var(--card, 620px); margin-left: calc(var(--card, 620px) / -2);
  border: 1px solid var(--line); border-radius: 14px; background: var(--surface);
  overflow: hidden; transition: transform 260ms ease, opacity 260ms ease; }
.card.on { border-color: var(--accent); }
/* A neighbour chat stays soft and small, so it does not fight for attention. */
.card.ghost { opacity: .4; filter: blur(1.5px); cursor: pointer; }
/* The soft picture lives in every card, and only the middle card uses its
   message box. A card keeps its parts, so a turn stays smooth. */
.soft { position: absolute; inset: 0; }
.card.on .soft { display: none; }
.card.ghost .msgs { display: none; }
.gt { font-size: 13px; font-weight: 600; margin: 12px 14px 0; overflow: hidden;
  white-space: nowrap; text-overflow: ellipsis; }
.gp { font-size: 12px; color: var(--dim); margin: 8px 14px 0; overflow: hidden;
  display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; }
.gb { position: absolute; border-radius: 10px; }
.gb.a { left: 14px; bottom: 78px; width: 60%; height: 44px; background: var(--tint); }
.gb.b { right: 12%; bottom: 40px; width: 55%; height: 34px; background: var(--line); }
.gb.c { left: 14px; bottom: 14px; width: 72%; height: 22px; background: var(--tint); }

/* A wash of the page colour over each side, so a neighbour barely shows. */
.wash { position: absolute; top: 0; bottom: 0; width: var(--peek, 46px);
  pointer-events: none; z-index: 2; }
.wash.l { left: 0; background: linear-gradient(90deg, var(--fade), rgba(0, 0, 0, 0)); }
.wash.r { right: 0; background: linear-gradient(270deg, var(--fade), rgba(0, 0, 0, 0)); }

/* The two sides that turn the carousel. */
.zone { position: absolute; top: 0; bottom: 0; width: var(--peek, 46px); z-index: 3;
  cursor: pointer; }
.zone.l { left: 0; }
.zone.r { right: 0; }
.turn { position: absolute; top: 50%; margin-top: -15px; width: 30px; height: 30px;
  border-radius: 15px; border: 1px solid var(--line); background: var(--surface);
  color: var(--dim); font-size: 17px; line-height: 1; z-index: 4; }
.turn:hover { color: var(--strong); border-color: var(--accent); background: var(--tint); }
.turn.l { left: 8px; }
.turn.r { right: 8px; }
.hidden { display: none; }

/* The row of small previews. The Alt key or the "Show chats" button brings it
   up. One card stands per chat, and only the place of a card changes. A click
   opens a preview, a drag and a flick move along the row. */
.previews { position: absolute; inset: 0; z-index: 5; display: none; }
.previews.on { display: block; }
/* The soft backdrop, so the row stands out of the page. */
.previews::before { content: ""; position: absolute; inset: 0; background: var(--bg);
  opacity: .66; }
.prev { position: absolute; top: 24px; left: 0; width: 190px; height: 218px;
  border: 1px solid var(--line); border-radius: 12px; background: var(--surface);
  overflow: hidden; cursor: pointer; will-change: transform, opacity; }
.prev.mid { border: 2px solid var(--accent); }
.pt { font-size: 13px; font-weight: 600; margin: 12px 12px 0; overflow: hidden;
  white-space: nowrap; text-overflow: ellipsis; }
.pp { font-size: 12px; color: var(--dim); margin: 8px 12px 0; overflow: hidden;
  display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; }
.pw { position: absolute; left: 12px; bottom: 10px; font-size: 11px; color: var(--dim); }

/* The first screen. The mark and a line for this hour stand above the chat box,
   and the box sits in the middle of the page. The parts of the page take a fixed
   place, so the box can move below the line that tells what the program does. */
.stage { order: 1; }
.under { order: 2; }
.composer { order: 3; }
.panel { order: 4; }
.hello { order: 0; display: flex; flex-direction: column; align-items: center;
  gap: 10px; height: 126px; overflow: hidden; text-align: center;
  transition: opacity 340ms ease, height 340ms ease; }
.hello .logo { width: 54px; height: 54px; }
.greet { font-size: 15px; color: var(--dim); max-width: 46ch; }
/* Away from the first screen the mark and the line fade away and take no room,
   so the chat box can sit at the bottom again. */
body:not(.home) .hello { height: 0; opacity: 0; }
body.home .area { justify-content: center; }
body.home .stage { flex: 0 0 auto; min-height: 0; }
body.home .under { order: 4; }
body.home .previews { display: none; }
body.home .composer { width: calc(100% - 24px); max-width: 720px; margin: 0 auto;
  border: 1px solid var(--line); border-radius: 12px; }
/* The chat grows from the top down when its first message comes. */
.card.grow { animation: grow-down 520ms cubic-bezier(.2, .7, .3, 1); }
@keyframes grow-down {
  from { clip-path: inset(0 0 100% 0); }
  to { clip-path: inset(0 0 0 0); }
}
/* A page that is asked for few moves leaves the row and the box still. */
@media (prefers-reduced-motion: reduce) {
  .card, .prev, .composer { transition: none; animation: none; }
}

.msgs { position: absolute; inset: 0; overflow-y: auto; padding: 14px; }
.blank { color: var(--dim); font-size: 13px; padding: 6px 4px; }
.msg { margin: 0 0 12px; padding: 9px 11px; border-radius: 10px;
  background: var(--bg); border: 1px solid var(--line); }
.msg.you { border-left: 3px solid var(--warm); }
.msg.assistant { border-left: 3px solid var(--accent); }
.msg.tool { border-left: 3px solid var(--ink); }
.msg.note { border-left: 3px solid var(--dim); color: var(--dim); }
.msg.bad { border-left-color: var(--deep); }
.head { font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--dim); margin-bottom: 4px; }
.body { white-space: pre-wrap; overflow-wrap: anywhere; }
.mono, pre { font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace; font-size: 13px; }
pre { margin: 8px 0 0; padding: 8px; border-radius: 8px; background: var(--bg);
  border: 1px solid var(--line); white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.bad pre { color: var(--deep); }

/* Composer with the two badges. */
/* The line under the carousel: a fresh chat, and what the program is doing. */
.under { display: flex; align-items: center; gap: 10px; padding: 6px 12px; }
.newchat { color: var(--strong); font-size: 12px; background: var(--bg);
  border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; }
.newchat:hover { background: var(--tint); border-color: var(--accent); }

.composer { border-top: 1px solid var(--line); background: var(--surface); padding: 9px 11px 11px; }
.badges { display: flex; align-items: center; gap: 7px; margin-bottom: 7px; }
.badge { font-size: 12px; padding: 3px 10px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); color: var(--dim); background: var(--bg); }
.badge.on { color: var(--bg); background: var(--accent); border-color: var(--accent); }
.badge.off { color: var(--deep); border-color: var(--deep); }
.status { font-size: 12px; color: var(--dim); overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
textarea { width: 100%; resize: vertical; min-height: 58px; }
.row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.act { border-radius: 8px; border: 1px solid var(--line); padding: 6px 12px;
  background: var(--bg); font-size: 13px; }
.act.send { color: #fff8f0; background: var(--accent); border-color: var(--accent); }
.act.stop { color: var(--deep); border-color: var(--deep); }
.hint { font-size: 12px; color: var(--dim); }

/* Small settings panel of the page. */
.panel { border-top: 1px solid var(--line); background: var(--surface); padding: 10px 12px; }
.panel.hidden { display: none; }
.panel label { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.panel p { margin: 8px 0 0; font-size: 12px; color: var(--dim); }

@media (max-width: 760px) {
  .title { max-width: 18ch; }
  .turn.l { left: 4px; }
  .turn.r { right: 4px; }
}
</style>
</head>
<body>
<div class="top">
  <img class="logo" src="/autumn-natter.svg" alt="">
  <span class="name">Autumn Natter</span>
  <span class="ctl"><select id="model" title="Model"></select><span class="tag" id="kind"></span></span>
  <span class="ctl"><select id="repo" title="Repository"></select>
    <button class="act" id="newrepo" title="New repository">+</button></span>
  <span class="title" id="title"></span>
  <span class="grow"></span>
  <span class="where" id="where"></span>
  <span class="ctx"><span id="ctxtext"></span><span class="bar"><span class="fill" id="ctxfill"></span></span></span>
</div>

<!-- The first screen: the mark and a line for this hour, above the chat box. -->
<div class="area">
  <div class="hello" id="hello">
    <img class="logo" src="/autumn-natter.svg" alt="">
    <span class="greet" id="greet"></span>
  </div>

  <!-- The carousel. The card in the middle is the chat in use. -->
  <div class="stage" id="stage">
    <div id="cards"></div>
    <span class="wash l" id="washL"></span>
    <span class="wash r" id="washR"></span>
    <div class="zone l" id="zoneL" title="Show the chat on the left"></div>
    <div class="zone r" id="zoneR" title="Show the chat on the right"></div>
    <button class="turn l" id="turnL" title="Show the chat on the left">&#8249;</button>
    <button class="turn r" id="turnR" title="Show the chat on the right">&#8250;</button>
    <div class="previews" id="previews"></div>
  </div>

  <div class="under">
    <button class="newchat" id="newchat">+ New chat</button>
    <button class="newchat" id="chatsbtn" title="Show the chats as small previews">Show chats</button>
    <span class="grow"></span>
    <span class="status" id="status"></span>
  </div>

  <div class="composer">
    <div class="badges">
      <span class="badge" id="code" title="Let the model run a terminal command">Code</span>
      <span class="badge" id="sandbox" title="Run every command inside a bubblewrap sandbox">Sandbox</span>
      <span class="grow"></span>
    </div>
    <textarea id="draft" rows="2" placeholder="Ask something"></textarea>
    <div class="row">
      <button class="act" id="settingsbtn">Settings</button>
      <span class="hint" id="hint">Enter sends. Shift Enter adds a line.</span>
      <span class="grow"></span>
      <button class="act stop" id="stop">Stop</button>
      <button class="act send" id="send">Send</button>
    </div>
  </div>

  <div class="panel hidden" id="panel">
    <label><input type="checkbox" id="dark"> Dark mode</label>
    <p id="note"></p>
    <p>The full settings live on the computer that runs Autumn Natter.</p>
  </div>
</div>

<script>
'use strict';

// The parts of the page that stay in place. Their content is written again on
// every draw.
var ids = ['model', 'kind', 'repo', 'newrepo', 'title', 'ctxtext', 'ctxfill', 'where',
  'stage', 'cards', 'washL', 'washR', 'zoneL', 'zoneR', 'turnL', 'turnR', 'previews',
  'hello', 'greet', 'newchat', 'chatsbtn', 'code', 'sandbox', 'status', 'draft',
  'settingsbtn', 'panel', 'dark', 'note', 'send', 'stop', 'hint'];
// The chat box moves between the middle of the page and the bottom, so it is
// taken by name too.
var composer = document.querySelector('.composer');
var el = {};
for (var i = 0; i < ids.length; i++) { el[ids[i]] = document.getElementById(ids[i]); }

// The message box lives inside the open card, so it is taken again each time
// the cards are built.
var msgs = null;

// A touch screen gets a send button. Other screens send with the Enter key.
var touch = (window.matchMedia && window.matchMedia('(pointer: coarse)').matches)
  || ('ontouchstart' in window);

var rev = -1;          // what the page has seen last
var timer = null;       // the next poll
var pending = false;    // only one poll at a time
var cur = null;         // the last state

function post(path, body) {
  fetch(path, {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify(body || {})
  }).then(function () { poll(); }).catch(function () { poll(); });
}

function poll() {
  if (pending) { return; }
  pending = true;
  fetch('/api/state?since=' + rev)
    .then(function (r) { return r.json(); })
    .then(function (s) {
      rev = s.rev;
      if (!s.unchanged) { draw(s); }
      schedule(!!s.generating);
    })
    .catch(function () { schedule(false); })
    .then(function () { pending = false; });
}

// A fast poll while an answer comes in, a slow one when nothing happens.
function schedule(fast) {
  clearTimeout(timer);
  timer = setTimeout(poll, fast ? 150 : 600);
}

function draw(s) {
  cur = s;
  drawHome(s);
  document.body.classList.toggle('dark', !!s.dark);
  fillSelect(el.model, s.models, s.model.id, function (m) { return m.name + ' (' + m.kind + ')'; });
  fillRepos(s);
  el.kind.textContent = s.model.kind;
  el.title.textContent = s.chat.title;
  el.ctxtext.textContent = s.context.used + ' / ' + s.context.total + ' tokens';
  el.ctxfill.style.width = Math.round(Math.min(1, s.context.ratio) * 100) + '%';
  el.code.classList.toggle('on', !!s.code);
  el.sandbox.classList.toggle('on', !!s.sandbox);
  el.sandbox.classList.toggle('off', !!s.sandbox && !s.sandbox_available);
  el.status.textContent = s.status;
  el.note.textContent = s.sandbox_note;
  el.dark.checked = !!s.dark;
  drawChats(s);
  drawMessages(s);
  // The send button is only for a touch screen. The stop button is there while
  // an answer comes in, on every screen.
  el.send.style.display = (touch && !s.generating) ? '' : 'none';
  el.stop.style.display = s.generating ? '' : 'none';
  el.hint.style.display = touch ? 'none' : '';
  // A chat that came or went away changes the row, so it is made again.
  if (ov.on) { buildPreviews(ov.pos); placePreviews(); }
}

// A list is built again only when its content changed. This keeps an open
// choice list of the browser from closing on every poll.
function fillSelect(sel, items, active, label) {
  var key = items.map(function (m) { return m.id; }).join('|') + '#' + active;
  if (sel.dataset.key === key) { return; }
  sel.dataset.key = key;
  sel.innerHTML = '';
  for (var n = 0; n < items.length; n++) {
    var option = document.createElement('option');
    option.value = items[n].id;
    option.textContent = label(items[n]);
    if (items[n].id === active) { option.selected = true; }
    sel.appendChild(option);
  }
}

function fillRepos(s) {
  var items = [{ id: '', name: 'No repository' }].concat(s.repositories);
  var key = items.map(function (r) { return r.id; }).join('|') + '#' + s.repository.id;
  if (el.repo.dataset.key === key) { return; }
  el.repo.dataset.key = key;
  el.repo.innerHTML = '';
  for (var n = 0; n < items.length; n++) {
    var option = document.createElement('option');
    option.value = items[n].id;
    option.textContent = items[n].name;
    if (items[n].id === s.repository.id) { option.selected = true; }
    el.repo.appendChild(option);
  }
  // The full list of repositories is not built yet, so this choice only shows
  // that it exists.
  var all = document.createElement('option');
  all.textContent = 'View all repositories';
  all.disabled = true;
  el.repo.appendChild(all);
}

// Space between two cards of the carousel.
var CARD_GAP = 14;

// Work out how wide a card is, and hand the numbers to the style. The two
// neighbours take a fixed strip at each side of the window.
function cardStep() {
  var width = el.stage.clientWidth || 640;
  var peek = width < 620 ? 26 : 46;
  var card = Math.max(280, width - 2 * peek);
  el.stage.style.setProperty('--card', card + 'px');
  el.stage.style.setProperty('--peek', peek + 'px');
  return card + CARD_GAP;
}

// Stand the cards up. The open chat sits in the middle, and its neighbours
// show a strip of themselves at each side.
function drawChats(s) {
  var step = cardStep();
  var index = s.carousel ? s.carousel.index : 0;
  // The list is built again only when a chat came or went away.
  var key = s.chats.map(function (c) { return c.id; }).join('|');
  if (el.cards.dataset.key !== key) {
    el.cards.dataset.key = key;
    buildCards(s, index, step);
  }
  var cards = el.cards.children;
  for (var n = 0; n < cards.length; n++) {
    var on = n === index;
    cards[n].classList.toggle('on', on);
    cards[n].classList.toggle('ghost', !on);
    if (!on) { paintSoft(cards[n], s.chats[n]); }
    cards[n].style.transform = 'translateX(' + ((n - index) * step) + 'px)';
  }
  // The message box of the middle card is the one the page writes into.
  msgs = index < cards.length ? cards[index].querySelector('.msgs') : null;
  // A side is there only when a chat sits that way.
  var left = index > 0;
  var right = index < s.chats.length - 1;
  el.zoneL.classList.toggle('hidden', !left);
  el.turnL.classList.toggle('hidden', !left);
  el.washL.classList.toggle('hidden', !left);
  el.zoneR.classList.toggle('hidden', !right);
  el.turnR.classList.toggle('hidden', !right);
  el.where.textContent = s.chats.length > 1
    ? (index + 1) + ' of ' + s.chats.length : '';
}

// One card per chat. A card holds a message box and a soft picture, and shows
// one of them. The soft picture tells the user that the chat holds a talk.
// A card is made once and then only moved, so a turn of the carousel is
// smooth. The list is built again when a chat arrives or goes away.
function buildCards(s, index, step) {
  el.cards.innerHTML = '';
  var made = [];
  for (var n = 0; n < s.chats.length; n++) {
    var card = document.createElement('div');
    card.className = 'card ghost';
    card.dataset.id = s.chats[n].id;
    // No slide for the first stand, because the place is not known yet.
    card.style.transition = 'none';
    card.style.transform = 'translateX(' + ((n - index) * step) + 'px)';

    var soft = document.createElement('div');
    soft.className = 'soft';
    var title = document.createElement('div');
    title.className = 'gt';
    var preview = document.createElement('div');
    preview.className = 'gp';
    soft.appendChild(title);
    soft.appendChild(preview);
    // Shapes that stand for the message bubbles of that chat.
    var names = ['a', 'b', 'c'];
    for (var b = 0; b < names.length; b++) {
      var bar = document.createElement('div');
      bar.className = 'gb ' + names[b];
      soft.appendChild(bar);
    }
    var box = document.createElement('div');
    box.className = 'msgs';

    card.appendChild(soft);
    card.appendChild(box);
    el.cards.appendChild(card);
    made.push(card);
  }
  // The place is now set without an animation, so the next change can slide.
  void el.cards.offsetWidth;
  for (var m = 0; m < made.length; m++) { made[m].style.transition = ''; }
}

// The soft picture of a neighbour chat: its name and the start of its newest
// message. The work is skipped when nothing changed.
function paintSoft(card, c) {
  var soft = card.querySelector('.soft');
  var key = c.title + '|' + c.preview;
  if (soft.dataset.key === key) { return; }
  soft.dataset.key = key;
  soft.querySelector('.gt').textContent = c.title;
  soft.querySelector('.gp').textContent = c.preview;
}

// A click on a neighbour chat turns the carousel to it.
el.cards.addEventListener('click', function (event) {
  var card = event.target.closest ? event.target.closest('.card') : null;
  if (!card || card.classList.contains('on')) { return; }
  if (card.dataset.id) { openChat(card.dataset.id); }
});

// Turn the carousel. Minus one shows the chat at the left.
function roll(step) {
  post('/api/roll', { step: step });
}

function openChat(id) {
  post('/api/open_chat', { id: id });
}

function drawMessages(s) {
  var box = msgs;
  if (!box) { return; }
  // Keep the newest message in view while an answer comes in.
  var near = box.scrollHeight - (box.scrollTop + box.clientHeight) < 90;
  box.innerHTML = '';
  var items = s.messages.slice();
  if (s.generating) {
    items.push({ role: 'Assistant', body: s.live, tool: '', mono: false, failed: false, when: '' });
  }
  if (items.length === 0) {
    // A chat with nothing in it says what to do next.
    var blank = document.createElement('div');
    blank.className = 'blank';
    blank.textContent = 'Nothing written yet. Write below and press Enter. '
      + 'A chat with nothing in it goes away when you turn the carousel.';
    box.appendChild(blank);
    return;
  }
  for (var n = 0; n < items.length; n++) { box.appendChild(node(items[n])); }
  if (near || s.generating) { box.scrollTop = box.scrollHeight; }
}

// One message. The text is set as text, so a model cannot put HTML in the page.
function node(m) {
  var wrap = document.createElement('div');
  wrap.className = 'msg ' + m.role.toLowerCase() + (m.failed ? ' bad' : '');
  var head = document.createElement('div');
  head.className = 'head';
  head.textContent = (m.role === 'Assistant' ? 'Model' : m.role) + (m.when ? ' - ' + m.when : '');
  var body = document.createElement('div');
  body.className = 'body' + (m.mono ? ' mono' : '');
  body.textContent = m.body;
  wrap.appendChild(head);
  wrap.appendChild(body);
  if (m.tool) {
    var out = document.createElement('pre');
    out.textContent = m.tool;
    wrap.appendChild(out);
  }
  return wrap;
}

function send() {
  var text = el.draft.value.trim();
  if (!text) { return; }
  el.draft.value = '';
  post('/api/send', { text: text });
}

el.send.addEventListener('click', send);
el.stop.addEventListener('click', function () { post('/api/cancel'); });
el.newchat.addEventListener('click', function () { post('/api/new_chat'); });
// The two sides of the window turn the carousel.
el.zoneL.addEventListener('click', function () { roll(-1); });
el.zoneR.addEventListener('click', function () { roll(1); });
el.turnL.addEventListener('click', function () { roll(-1); });
el.turnR.addEventListener('click', function () { roll(1); });
// A new window size changes the width of the cards.
window.addEventListener('resize', function () { if (cur) { drawChats(cur); } });
el.model.addEventListener('change', function (e) { post('/api/select_model', { id: e.target.value }); });
el.repo.addEventListener('change', function (e) { post('/api/select_repository', { id: e.target.value }); });
el.newrepo.addEventListener('click', function () {
  var name = window.prompt('Name of the new repository');
  if (name && name.trim()) { post('/api/create_repository', { name: name.trim() }); }
});
el.code.addEventListener('click', function () { if (cur) { post('/api/code', { on: !cur.code }); } });
el.sandbox.addEventListener('click', function () { if (cur) { post('/api/sandbox', { on: !cur.sandbox }); } });
el.dark.addEventListener('change', function (e) { post('/api/dark', { on: e.target.checked }); });
el.settingsbtn.addEventListener('click', function () { el.panel.classList.toggle('hidden'); });
el.chatsbtn.addEventListener('click', function () { showRow(true); });

el.draft.addEventListener('keydown', function (e) {
  // While the row of previews is up, the row takes every key.
  if (ov.on) { return; }
  if (e.key === 'Enter' && !e.shiftKey && !touch) {
    e.preventDefault();
    send();
  } else if (e.key === 'Escape') {
    post('/api/cancel');
  }
});

// --------------------------------------------------------------------
// The first screen, and the row of small previews.
//
// With no chat open, the chat box stands in the middle of the page, under the
// mark and a line for this hour. The first message opens a chat: the chat grows
// from the top down, and the box goes back to the bottom. The Alt key or the
// "Show chats" button turns the chats into a row of small previews. A click on a
// preview opens that chat. The arrows, A and D, a drag, a flick and the wheel
// move along the row.
// --------------------------------------------------------------------

// A page that is asked for few moves keeps the row and the chat box still.
var reduce = !!(window.matchMedia
  && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

// The state of the row. The place of every preview is worked out from these
// numbers on every frame, so nothing is built again while the row moves.
var ov = {
  on: false,     // true while the row is up
  pos: 0,        // where the row stands, counted in previews
  target: 0,     // where the row wants to rest
  speed: 0,      // previews for every frame, from a flick
  open: 1,       // 0 to 1 while the row settles after it came up
  drag: false,   // true while the pointer holds the row
  from: 0,       // where the row stood when the pointer went down
  pointer: 0,    // where the pointer was when it went down
  last: 0,       // where the pointer stood in the last move
  flick: 0,      // speed of the last move, in previews for one frame
  frame: 0,      // the frame that is planned, or 0 for none
  pressed: -1    // which preview the pointer went down on, or -1
};

// Space between two previews.
var PREV_GAP = 18;

// How many chats this place holds.
function chatCount() { return cur && cur.chats ? cur.chats.length : 0; }

// The chat the carousel stands on.
function chatIndex() { return cur && cur.carousel ? cur.carousel.index : 0; }

// Keeps a chat number inside the list of this place.
function keepInside(value) { return Math.max(0, Math.min(chatCount() - 1, value)); }

// Width of one preview, and the step from one preview to the next.
function prevWidth() {
  var width = el.stage.clientWidth || 640;
  return Math.max(150, Math.min(230, (width - 60) / 4));
}
function prevStep() { return prevWidth() + PREV_GAP; }

// The previews are made once and only moved after that. Only the fifteen about
// the chat in use are made, so a place with a hundred chats stays light to draw.
function buildPreviews(centre) {
  var start = Math.max(0, Math.min(Math.max(0, chatCount() - 15),
      Math.round(keepInside(centre)) - 7));
  var stop = Math.min(chatCount(), start + 15);
  var key = start + '-' + stop + '-'
    + cur.chats.slice(start, stop).map(function (c) { return c.id; }).join('|');
  if (el.previews.dataset.key === key) { return; }
  el.previews.dataset.key = key;
  el.previews.innerHTML = '';
  for (var n = start; n < stop; n++) {
    var card = document.createElement('div');
    card.className = 'prev';
    card.dataset.n = n;
    card.dataset.id = cur.chats[n].id;
    var title = document.createElement('div');
    title.className = 'pt';
    title.textContent = cur.chats[n].title;
    var line = document.createElement('div');
    line.className = 'pp';
    line.textContent = cur.chats[n].preview;
    var when = document.createElement('div');
    when.className = 'pw';
    when.textContent = cur.chats[n].when;
    card.appendChild(title);
    card.appendChild(line);
    card.appendChild(when);
    el.previews.appendChild(card);
  }
}

// Stand the previews in their place. Only the place, the size and the strength
// of a card change, which is what keeps the motion smooth.
function placePreviews() {
  var step = prevStep();
  var width = prevWidth();
  var height = Math.round(width * 1.15);
  var centre = (el.stage.clientWidth - width) / 2;
  // The row comes up big and shrinks into place, which is the look of a scale
  // that goes from 1.6 down to 1.
  var settle = 1 + (1 - ov.open) * 0.6;
  var middle = Math.round(ov.pos);
  var cards = el.previews.children;
  for (var n = 0; n < cards.length; n++) {
    var at = Number(cards[n].dataset.n);
    var x = centre + (at - ov.pos) * step;
    var on = at === middle;
    cards[n].style.width = width + 'px';
    cards[n].style.height = height + 'px';
    cards[n].style.transform = 'translate(' + x.toFixed(1) + 'px, 0) scale('
      + settle.toFixed(3) + ')';
    cards[n].style.opacity = (ov.open * (on ? 1 : 0.62)).toFixed(3);
    cards[n].classList.toggle('mid', on);
  }
}

// One frame of the row. A flick keeps gliding and gives a little speed back on
// every frame, and the row then settles on the nearest preview.
function stepRow() {
  ov.frame = 0;
  var last = Math.max(0, chatCount() - 1);
  if (ov.open < 1) { ov.open = Math.min(1, ov.open + 0.07); }
  if (!ov.drag) {
    if (Math.abs(ov.speed) > 0.008 && !reduce) {
      ov.pos += ov.speed;
      ov.speed *= 0.94;
      // At an end there is nothing left to see, so the row stops there.
      if (ov.pos < 0) { ov.pos = 0; ov.speed = 0; }
      if (ov.pos > last) { ov.pos = last; ov.speed = 0; }
      ov.target = keepInside(Math.round(ov.pos));
    } else {
      ov.speed = 0;
      var gap = ov.target - ov.pos;
      if (Math.abs(gap) < 0.004) { ov.pos = ov.target; } else { ov.pos += gap * 0.22; }
    }
  }
  placePreviews();
  var still = ov.speed === 0 && ov.pos === ov.target && ov.open >= 1;
  if (ov.on && !still) { runRow(); }
}

// Ask for the next frame, once.
function runRow() {
  if (ov.on && !ov.frame) { ov.frame = requestAnimationFrame(stepRow); }
}

// Bring the row up, or put it away again.
function showRow(on) {
  if (on === ov.on) { return; }
  ov.on = on;
  el.previews.classList.toggle('on', on);
  if (!on) {
    if (ov.frame) { cancelAnimationFrame(ov.frame); ov.frame = 0; }
    ov.drag = false;
    return;
  }
  ov.pos = chatIndex();
  ov.target = chatIndex();
  ov.speed = 0;
  ov.open = reduce ? 1 : 0;
  ov.drag = false;
  ov.pressed = -1;
  buildPreviews(ov.pos);
  placePreviews();
  runRow();
}

// One step with the keys. A key always moves the row, so the middle preview
// changes even when the row stood on a preview edge.
function rowStep(step) {
  ov.speed = 0;
  ov.target = keepInside(Math.round(ov.target) + step);
  if (reduce) { ov.pos = ov.target; }
  runRow();
}

// Open one chat of the row. Without a number, the chat in the middle is opened.
function pickRow(at) {
  var n = at === undefined ? Math.round(ov.pos) : keepInside(Math.round(at));
  if (!cur || !cur.chats[n]) { return; }
  showRow(false);
  openChat(cur.chats[n].id);
}

// The pointer went down on the row.
el.previews.addEventListener('pointerdown', function (event) {
  var card = event.target.closest ? event.target.closest('.prev') : null;
  ov.pressed = card ? Number(card.dataset.n) : -1;
  ov.drag = true;
  ov.from = ov.pos;
  ov.pointer = event.clientX;
  ov.last = event.clientX;
  ov.flick = 0;
  ov.speed = 0;
  if (el.previews.setPointerCapture) { el.previews.setPointerCapture(event.pointerId); }
  runRow();
});

// The pointer moved while the row was held down, so the row follows it and a
// preview stays under the pointer.
el.previews.addEventListener('pointermove', function (event) {
  if (!ov.drag) { return; }
  var step = prevStep();
  ov.flick = (event.clientX - ov.last) / step;
  ov.last = event.clientX;
  var last = Math.max(0, chatCount() - 1);
  // A drag to the right brings the chats that came before, so the count of the
  // row goes the other way.
  ov.pos = Math.max(-0.6, Math.min(last + 0.6,
      ov.from - (event.clientX - ov.pointer) / step));
  ov.target = keepInside(Math.round(ov.pos));
  runRow();
});

// The pointer let go. A short press that did not move opens the preview it stood
// on. A flick keeps gliding until the row settles.
el.previews.addEventListener('pointerup', function (event) {
  if (!ov.drag) { return; }
  ov.drag = false;
  var moved = Math.abs(event.clientX - ov.pointer);
  var stood = ov.pressed;
  ov.pressed = -1;
  if (moved < 6) {
    if (stood >= 0) { pickRow(stood); } else { runRow(); }
    return;
  }
  ov.speed = Math.max(-0.6, Math.min(0.6, -ov.flick));
  runRow();
});

el.previews.addEventListener('pointercancel', function () {
  ov.drag = false;
  runRow();
});

// The wheel moves along the row.
el.previews.addEventListener('wheel', function (event) {
  event.preventDefault();
  var down = Math.abs(event.deltaY) >= Math.abs(event.deltaX) ? event.deltaY : event.deltaX;
  rowStep(down > 0 ? 1 : -1);
}, { passive: false });

// The keys of the row. Alt brings the row up or takes it away, Escape puts it
// away, the arrows and A and D move along it, and Enter opens the middle preview.
document.addEventListener('keydown', function (event) {
  if (event.key === 'Alt') {
    event.preventDefault();
    showRow(!ov.on);
    return;
  }
  if (!ov.on) { return; }
  if (event.key === 'Escape') { showRow(false); return; }
  if (event.key === 'ArrowLeft' || event.key === 'a') { rowStep(-1); return; }
  if (event.key === 'ArrowRight' || event.key === 'd') { rowStep(1); return; }
  if (event.key === 'Enter') { pickRow(); return; }
  // Nothing else reaches the chat box while the row is up.
  if (event.key !== 'Tab') { event.preventDefault(); }
});

// Move the chat box between the middle of the page and the bottom without a
// jump. The place before the change is kept, and the box is slid from there to
// the place it has now.
function slidePart(part, change) {
  if (!part) { change(); return; }
  if (reduce) { change(); return; }
  var before = part.getBoundingClientRect();
  change();
  var after = part.getBoundingClientRect();
  var dx = before.left - after.left;
  var dy = before.top - after.top;
  if (Math.abs(dx) < 1 && Math.abs(dy) < 1) { return; }
  part.style.transition = 'none';
  part.style.transform = 'translate(' + dx + 'px, ' + dy + 'px)';
  void part.offsetWidth;
  part.style.transition = 'transform 420ms cubic-bezier(.2, .7, .3, 1)';
  part.style.transform = '';
}

// The first screen. The mark and the line for this hour come and go with it.
function drawHome(s) {
  var home = !!s.home;
  var was = document.body.classList.contains('home');
  el.greet.textContent = s.greeting || '';
  if (home === was) { return; }
  // The chat box slides, and the mark and the line fade. A chat that the first
  // message opens grows from the top down.
  slidePart(composer, function () { document.body.classList.toggle('home', home); });
  if (home) {
    showRow(false);
    return;
  }
  var index = s.carousel ? s.carousel.index : 0;
  var cards = el.cards.children;
  if (cards[index]) {
    cards[index].classList.add('grow');
    setTimeout(function () { cards[index].classList.remove('grow'); }, 620);
  }
}

poll();
</script>
