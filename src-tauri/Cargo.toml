# The desktop window of Autumn Natter. It is a Tauri app: the engine and all the work live in
# the core crate, and the window shows an HTML page with the web view that the operating system
# already has.
[package]
name = "autumn-natter"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Chat client for local LLMs. It uses llama.cpp as the inference backend."
license = "MIT"
repository = "https://github.com/frostyautumnleaf/autumn-natter"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
autumn-natter-core = { path = "../" }
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
# A file the window took from the computer goes to the page as a data URL, which is the form the
# page already sends back with a message.
base64 = "0.22"
image = { version = "0.25", default-features = false }
png = "0.18"

[target.'cfg(not(target_os = "linux"))'.dependencies]
xcap = "0.9.10"

# The window of this system asks the clipboard of the computer through GTK, the toolkit the web
# view of the system is on. No other system has that tool.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
webkit2gtk = "2.0"
percent-encoding = "2"
