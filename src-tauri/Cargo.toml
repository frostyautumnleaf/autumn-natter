# The desktop window of Autumn Natter. It is a Tauri app: the engine and all
# the work live in the core crate, and the window shows an HTML page with the
# web view that the operating system already has.
[package]
name = "autumn-natter"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Chat client for local LLMs. It uses llama.cpp as the inference backend."
license = "MIT"
repository = "https://github.com/frostyautumnleaf/autumn-natter"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
autumn-natter-core = { path = "../" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A file the window took from the machine goes to the page as a data URL, which
# is the shape the page already sends back with a message.
base64 = "0.22"

# The window of this system asks the clipboard of the machine through GTK, the
# toolkit the web view of the system stands on. No other system has that tool.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
percent-encoding = "2"
