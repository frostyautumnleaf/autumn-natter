<?xml version="1.0" encoding="UTF-8"?>
<!--
  Autumn Natter application icon.
  A leaf of five lobes: a point at the top, a notch at the foot, the midrib and
  its veins in the deeper accent. The ground is transparent.
  Accent colours: #ED7401 #DF6101 #C53C01 #AC4422 #AF2600
-->
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="leafBody" x1="18" y1="14" x2="104" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ED7401"/>
      <stop offset="0.40" stop-color="#DF6101"/>
      <stop offset="0.74" stop-color="#C53C01"/>
      <stop offset="1" stop-color="#AC4422"/>
    </linearGradient>
    <linearGradient id="leafShade" x1="64" y1="100" x2="64" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#AF2600" stop-opacity="0.40"/>
      <stop offset="0.5" stop-color="#AF2600" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#AF2600" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="stemBody" x1="62" y1="86" x2="72" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#AC4422"/>
      <stop offset="1" stop-color="#AF2600"/>
    </linearGradient>
  </defs>

  <!-- The foot of the leaf: the stalk stands in the notch. -->
  <path d="M64 86 C63 96 62 106 59 115" stroke="url(#stemBody)" stroke-width="4.4"
        stroke-linecap="round"/>

  <!-- The body: five lobes, the point at the top and the notch at the foot. -->
  <path d="M64 14
           C72 16 84 24 92 34
           C90 40 84 42 78 44
           C88 48 104 50 112 58
           C110 64 100 66 92 68
           C100 74 96 84 98 90
           C94 96 78 100 70 96
           C67 94 65 91 64 88
           C63 91 61 94 58 96
           C50 100 34 96 30 90
           C32 84 28 74 36 68
           C28 66 18 64 16 58
           C24 50 40 48 50 44
           C44 42 38 40 36 34
           C44 24 56 16 64 14 Z"
        fill="url(#leafBody)"/>
  <path d="M64 14
           C72 16 84 24 92 34
           C90 40 84 42 78 44
           C88 48 104 50 112 58
           C110 64 100 66 92 68
           C100 74 96 84 98 90
           C94 96 78 100 70 96
           C67 94 65 91 64 88
           C63 91 61 94 58 96
           C50 100 34 96 30 90
           C32 84 28 74 36 68
           C28 66 18 64 16 58
           C24 50 40 48 50 44
           C44 42 38 40 36 34
           C44 24 56 16 64 14 Z"
        fill="url(#leafShade)"/>

  <!-- The midrib and the veins of the five lobes, in the deeper accent. -->
  <g stroke="#AF2600" stroke-linecap="round" opacity="0.55">
    <path d="M64 86 L64 21" stroke-width="2.4"/>
    <path d="M64 74 L89 37" stroke-width="1.9"/>
    <path d="M64 74 L39 37" stroke-width="1.9"/>
    <path d="M64 79 L107 58" stroke-width="1.9"/>
    <path d="M64 79 L21 58" stroke-width="1.9"/>
    <path d="M64 84 L95 88" stroke-width="1.9"/>
    <path d="M64 84 L33 88" stroke-width="1.9"/>
  </g>
</svg>
