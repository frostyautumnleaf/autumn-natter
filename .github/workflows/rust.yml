name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # The core has no window, so the rules of the chats are checked here with no
  # web view and no model.
  test-core:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Test the core
      run: cargo test -p autumn-natter-core

  # The window is a Tauri app, so it needs the web view of the system.
  build-window:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install the web view
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev build-essential curl wget file \
          libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config
    - name: Build the window
      run: cargo build --release
